name: Community recipes apply

on:
  push:
    branches: [community-recipes]
    paths:
      - tools/community-recipes.part*
      - .github/workflows/community-recipes-apply.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-recipes
          fetch-depth: 0
      - name: Apply exact Community recipes patch
        run: |
          cat tools/community-recipes.part* > /tmp/community-recipes.patch
          patch -p1 < /tmp/community-recipes.patch
      - name: Focused Community recipe checks
        run: |
          python3 - <<'PY'
          import json, re, subprocess, tempfile
          from pathlib import Path
          html = Path('index.html').read_text()
          version = json.loads(Path('version.json').read_text())
          meta = re.search(r'<meta name="lowi-build" content="([^"]+)">', html)
          assert meta and meta.group(1) == version['build'] == '20261011-131814'
          assert version['news']['id'] == 'community-recipes'

          # Existing posts.rec cloud contract is reused; no new recipe backend/table.
          assert 'rec:r.rec || ""' in html
          assert 'rec:p.rec || ""' in html
          for forbidden in ('community_recipes','recipe_posts','from("recipes")','from("community_recipes")'):
              assert forbidden not in html

          # Any post type can carry a recipe; recipe-only posts are valid and get the recipe image/chip.
          required = [
            'if (p.rec && typeof FOOD_IMG !== "undefined" && FOOD_IMG[p.rec])',
            'textOnly = !p.url && !p.photo && !p.vid && !p.rec && !FY_IMG[p.id]',
            '(p.rec && window.FYV ? FYV.recChip(p) : "")',
            'function compose(prefill, text, rec)',
            'LowiR3F.postSheet(prefill, text, rec)',
            'function composeInto(el, prefill, text, rec)',
            'rec:rec || ""',
            'id="trRec"',
            'rec:C.rec || ""',
            '(!cap && !C.photo && !C.rec)',
            'if (!C.cap.trim() && !C.photo && !C.rec) return;',
            'C.rec = e.target.value || ""; paintRest();',
            'function shareRecipe(id)',
            'LowiR3F.postSheet("", "", r.id)',
            'TRIBE.composeInto($("#r3fCompose"), prefill || "", text || "", rec || "")'
          ]
          for needle in required:
              assert needle in html, needle
          assert html.count('data-tr="share-recipe"') == 2

          # The selector must cover all 25 built-in Recipe Book recipes.
          start = html.index('const RECIPE_BOOK = [')
          end = html.index('];', start)
          book = html[start:end]
          recipes = re.findall(r'\{c:"(?:meal|snack|dessert|drink)"', book)
          assert len(recipes) == 25, len(recipes)

          # New UI strings remain multilingual.
          for phrase in ('Link a recipe (optional)','Rezept verknüpfen (optional)','Enlazar una receta (opcional)','Recipe linked','Rezept verknüpft','Receta enlazada'):
              assert phrase in html, phrase

          # Every inline script still parses.
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S|re.I)
          assert len(scripts) >= 50
          with tempfile.TemporaryDirectory() as td:
              for i, script in enumerate(scripts):
                  p = Path(td) / f'script-{i}.js'
                  p.write_text(script)
                  subprocess.run(['node','--check',str(p)], check=True, stdout=subprocess.DEVNULL)
          print(f'focused checks: PASS (25 recipes, {len(scripts)} inline scripts)')
          PY
          git diff --check
      - name: Commit generated app files only
        run: |
          rm tools/community-recipes.part*
          rm .github/workflows/community-recipes-apply.yml
          rmdir tools 2>/dev/null || true
          git config user.name "LOWiSPIKE deploy"
          git config user.email "therealetm@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git diff origin/main --name-only | sort | tr '\n' ' ')" = "index.html version.json "
          git commit -m "Community recipes in For You"
          git push origin HEAD:community-recipes
