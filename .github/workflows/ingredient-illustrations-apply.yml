name: Ingredient illustrations apply

on:
  push:
    branches: [ingredient-illustrations]
    paths:
      - tools/ingredient_illustrations.patch
      - .github/workflows/ingredient-illustrations-apply.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ingredient-illustrations
          fetch-depth: 0
      - name: Apply exact ingredient illustrations patch
        run: patch -p1 < tools/ingredient_illustrations.patch
      - name: Focused checks
        run: |
          python3 - <<'PY'
          import json, re, subprocess, tempfile
          from pathlib import Path
          html = Path('index.html').read_text()
          version = json.loads(Path('version.json').read_text())
          meta = re.search(r'<meta name="lowi-build" content="([^"]+)">', html)
          assert meta and meta.group(1) == version['build'] == '20261011-130930'
          assert version['news']['id'] == 'ingredient-illustrations'
          assert 'const ING_ART = {' in html
          assert 'function ingKind(i)' in html and 'function ingArt(i)' in html
          assert 'g:g || ""' in html
          assert re.search(r'function ingChip\(i, home, s\).*?ingArt\(i\)', html)
          assert re.search(r'p2-mise.*?ingArt\(g\)', html)
          assert html.count("<svg viewBox=\"0 0 32 32\"") >= 18

          # All 25 built-in recipe-book ingredient entries must resolve to a specific illustration kind.
          start = html.index('const RECIPE_BOOK = [')
          end = html.index('];', start)
          book = html[start:end]
          pairs = re.findall(r'"([a-z]+)\|([^"\\]+)"', book)
          assert len(pairs) == 134, len(pairs)
          def kind(g, n):
              g, n = g.lower(), n.lower()
              if 'egg' in n or g == 'eier': return 'egg'
              if 'avocado' in n: return 'avocado'
              if re.search(r'almond|chia|sesame|seed|walnut|nut', n): return 'seed'
              if re.search(r'oil|butter', n): return 'oil'
              if re.search(r'lime|lemon', n): return 'citrus'
              if 'mushroom' in n: return 'mushroom'
              if re.search(r'cucumber|zucchini|pickle|konjak|shirataki', n): return 'cucumber'
              if re.search(r'salmon|tuna|shrimp|fish', n): return 'fish'
              if re.search(r'chicken|turkey', n): return 'poultry'
              if re.search(r'beef|mince|steak|burger', n) or g == 'hack': return 'meat'
              if re.search(r'cheddar|feta|frisch|halloumi|mozzarella|parmesan|cheese', n) or g == 'kaese': return 'cheese'
              if re.search(r'yogurt|yoghurt|cottage|skyr|milk|cream', n) or g == 'milch': return 'dairy'
              if re.search(r'berry|berries', n): return 'berry'
              if re.search(r'cacao|cocoa|chocolate', n): return 'cocoa'
              if g == 'drink' or re.search(r'coffee|tea|water|broth|matcha|ice', n): return 'drink'
              if g == 'paprika' or 'bell pepper' in n: return 'pepper'
              if g == 'wuerze' or re.search(r'pepper|paprika|oregano|cinnamon|vanilla|mustard|sauce|salsa|tamari|chili', n): return 'spice'
              if g == 'snack': return 'cocoa'
              if g in ('gemuese','salat') or re.search(r'lettuce|cabbage|cauliflower|celery|scallion|mint|ginger|nori', n): return 'leaf'
              if g == 'fett': return 'avocado'
              return 'default'
          defaults = [(g,n) for g,n in pairs if kind(g,n) == 'default']
          assert not defaults, defaults

          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S|re.I)
          assert len(scripts) >= 50, len(scripts)
          with tempfile.TemporaryDirectory() as td:
              for i, script in enumerate(scripts):
                  p = Path(td) / f'script-{i}.js'
                  p.write_text(script)
                  subprocess.run(['node','--check',str(p)], check=True, stdout=subprocess.DEVNULL)
          print(f'focused checks: PASS ({len(pairs)} ingredients, {len(scripts)} inline scripts)')
          PY
          git diff --check
      - name: Commit generated app files only
        run: |
          rm tools/ingredient_illustrations.patch .github/workflows/ingredient-illustrations-apply.yml
          rmdir tools 2>/dev/null || true
          git config user.name "LOWiSPIKE deploy"
          git config user.email "therealetm@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "index.html version.json "
          git commit -m "Ingredient illustrations in recipes and Cook"
          git push origin HEAD:ingredient-illustrations
