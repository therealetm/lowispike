# Keeps the free Supabase backend awake (it pauses after 7 days without use). Runs every 3 days.
name: keep backend awake
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "https://vnfwmifmsfecascwaody.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_iVA3wCYxzfWu2q8SSgieWw_adXbx4Qd" -H "Content-Type: application/json" -d '{}'
