name: Sunrise Mode staging

on:
  push:
    branches: [b3-part2-finish]
    paths:
      - tools/sunrise.patch.gz.b64
      - .github/workflows/sunrise-apply.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b3-part2-finish
          fetch-depth: 0
      - name: Apply exact Sunrise patch
        run: base64 -d tools/sunrise.patch.gz.b64 | gzip -dc | patch -p1
      - name: Focused static and syntax checks
        run: |
          python3 - <<'PY'
          import json, re
          from html.parser import HTMLParser
          from pathlib import Path
          html = Path('index.html').read_text()
          version = json.loads(Path('version.json').read_text())
          meta = re.search(r'<meta name="lowi-build" content="([^"]+)">', html)
          assert meta and meta.group(1) == version['build'] == '20261011-113559'
          assert version['news']['id'] == 'sunrise-mode'
          assert version['news']['go'] == {'tab':'home','sel':'#pfBtn'}
          assert 'data-r2theme="sunrise"' in html
          assert 'R2.themeEffective' in html and 'scheduleSunrise()' in html
          assert 'h >= 7 && h < 19 ? "light" : "dark"' in html
          assert 'document.addEventListener("visibilitychange", () => { if (!document.hidden && R2.theme() === "sunrise") R2.applyTheme(); });' in html
          assert 'Night, Cloud or Sunrise' in html
          assert 'Dunkel, hell oder automatisch nach Uhrzeit' in html
          assert 'Oscuro, claro o automático según la hora' in html
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ins=False; self.src=False; self.buf=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script': self.ins=True; self.src=bool(dict(attrs).get('src')); self.buf=[]
              def handle_data(self, data):
                  if self.ins and not self.src: self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.ins:
                      if not self.src: self.scripts.append(''.join(self.buf))
                      self.ins=False
          p=P(); p.feed(html); Path('/tmp/lowi-scripts.js').write_text('\n;\n'.join(p.scripts))
          print('focused Sunrise checks: PASS')
          PY
          node --check /tmp/lowi-scripts.js
          git diff --check
      - name: Commit app files only
        run: |
          rm tools/sunrise.patch.gz.b64 .github/workflows/sunrise-apply.yml
          rmdir tools 2>/dev/null || true
          git config user.name "LOWiSPIKE deploy"
          git config user.email "therealetm@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Sunrise Mode: automatic day and night appearance"
          git push origin HEAD:b3-part2-finish
