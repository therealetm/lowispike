<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03050a">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>LOWiSPIKE Studio · Im Aufbau</title>
<meta name="description" content="Privat · im Aufbau.">
<link rel="canonical" href="https://therealetm.github.io/lowispike/affiliates/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="LOWiSPIKE">
<meta property="og:title" content="LOWiSPIKE Studio">
<meta property="og:description" content="Privat · im Aufbau.">
<meta property="og:url" content="https://therealetm.github.io/lowispike/affiliates/">
<meta property="og:image" content="https://therealetm.github.io/lowispike/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/lowispike/icon-192.png">
<link rel="apple-touch-icon" href="/lowispike/icon-180.png">
<!-- 25 Oct 2026: Studio is private. Only the lock below runs; the page's styles (rel="studio-stylesheet"), content (<template>)
     and scripts (type="text/x-studio") are not fetched or shown until the server says yes (studio-gate.js) -->
<link rel="stylesheet" href="../studio-lock.css">
<link rel="studio-stylesheet" href="blueprint.css">
<script src="../studio-lock-core.js"></script>
<script src="../studio-gate.js"></script>
</head>
<body>
<template id="studioPage">
<div class="rings" aria-hidden="true"></div>
<div class="wrap" id="app">
  <noscript><p class="card">Diese Seite braucht JavaScript.</p></noscript>

  <!-- 1 · Start: one calm screen, like Eden's Plan screen. Pick a series, see what you get, Start. -->
  <section class="view" id="viewStart" aria-labelledby="startTitle">
    <div class="bar">
      <div class="seg" id="seriesCards" role="group" aria-label="Serie wählen"></div>
      <button type="button" class="fab" id="fabEarn" aria-label="Was du verdienst">€</button>
    </div>
    <div class="hero">
      <span class="pill" id="startPill">Kostenlos · etwa drei Minuten</span>
      <h1 id="startTitle" tabindex="-1">Lass uns dein Video bauen.</h1>
      <p class="lead" id="startLead"></p>
      <div class="card list" id="startList"></div>
      <button type="button" class="primary" id="startBtn">Start <span aria-hidden="true">→</span></button>
      <p class="linkline" id="linkLine">Deinen persönlichen Affiliate-Link bekommst du direkt von Eman per WhatsApp.</p>
    </div>
  </section>

  <!-- 2 · The script, on its own screen -->
  <section class="view" id="scriptView" aria-live="polite" hidden></section>

  <!-- 3 · Recording: shot list, caption, the personality tip -->
  <section class="view" id="shotView" hidden>
    <div class="bar" id="shotBar"></div>
    <div class="head">
      <span class="pill" id="shotPill">Schritt 2 von 3</span>
      <h1 id="shotTitle" tabindex="-1">So nimmst du es auf.</h1>
      <p class="lead" id="shotLead"></p>
    </div>
    <div class="card list" id="shotCard"></div>
    <div class="card" id="captionCard"></div>
    <p class="card tip" id="tipLine"><b>Das ist dein Template.</b> Bring deine eigene Persönlichkeit rein: Wer sich vor der Kamera besser präsentiert, verkauft mehr. Nimm es selbst auf oder nutze einen KI-Avatar wie HeyGen oder Higgsfield. Das Template ist kostenlos.</p>
    <button type="button" class="primary" id="toEarn">Weiter: Dein Verdienst <span aria-hidden="true">→</span></button>
  </section>

  <!-- 4 · Earnings: the four levels and example totals -->
  <section class="view" id="earnView" aria-labelledby="earnTitle" hidden>
    <div class="bar" id="earnBar"></div>
    <div class="head">
      <span class="pill" id="earnPill">Schritt 3 von 3</span>
      <h1 id="earnTitle" tabindex="-1">Was du verdienst.</h1>
      <p class="lead" id="earnLead"></p>
    </div>
    <div class="card" id="levelTable"></div>
    <h2 class="label" id="exLabel">Beispiele</h2>
    <div id="exampleList"></div>
    <div class="card recruit" id="recruitCard"></div>
    <button type="button" class="primary" id="toStart">Fertig</button>
    <footer><p id="terms"></p></footer>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</template>
<script type="text/x-studio" src="blueprint-core.js"></script>
<script type="text/x-studio" src="access-core.js"></script>
<script type="text/x-studio" src="access-list.js"></script>
<script type="text/x-studio" src="recruits.js"></script>
<script type="text/x-studio" src="script-voice.js"></script>
<script type="text/x-studio" src="../app-voice.js"></script>
<script type="text/x-studio" src="blueprint.js"></script>
</body>
</html>
