<title>Fakeaway-Woche</title>
<style>
/* Layout: one phone column. Hero (today) > day strip > timeline > sticky shopping button. Sheets slide up for recipe and list. */
:root{
  /* Nov 8 2026: LOWiSPIKE's own look (the app's navy glass, cyan accent, light-blue primary pill, system type), no web fonts */
  --bg:#050b1e; --surface:rgba(255,255,255,.07); --surface2:rgba(255,255,255,.12); --line:rgba(143,231,255,.22);
  --fg:#eef6ff; --muted:#a9bdd6; --accent:#8fe7ff; --accent-ink:#06213f; --accent-text:#8fe7ff;
  --pill:linear-gradient(180deg,#f4fbff,#cfe6ff); --pill-ink:#0a2140;
  --ok:#86e3b0; --okbg:rgba(80,200,140,.16); --bad:#ff9a8a; --badbg:rgba(255,120,100,.14); --plate:rgba(255,255,255,.1); --shadow:0 14px 34px rgba(0,8,30,.55);
  --display:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,'Segoe UI',Roboto,sans-serif; --body:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef4fb; --surface:#ffffff; --surface2:#e3edf8; --line:rgba(31,127,196,.22);
  --fg:#0f2340; --muted:#4f6684; --accent:#1f7fc4; --accent-ink:#ffffff; --accent-text:#1663a0; --pill:linear-gradient(180deg,#2d8fd6,#1f6fb2); --pill-ink:#ffffff;
  --ok:#17683a; --okbg:#dff1e5; --bad:#a4372a; --badbg:#f8e1dc; --plate:#eaf3fc; --shadow:0 10px 30px rgba(40,70,120,.16); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef4fb; --surface:#ffffff; --surface2:#e3edf8; --line:rgba(31,127,196,.22);
  --fg:#0f2340; --muted:#4f6684; --accent:#1f7fc4; --accent-ink:#ffffff; --accent-text:#1663a0; --pill:linear-gradient(180deg,#2d8fd6,#1f6fb2); --pill-ink:#ffffff;
  --ok:#17683a; --okbg:#dff1e5; --bad:#a4372a; --badbg:#f8e1dc; --plate:#eaf3fc; --shadow:0 10px 30px rgba(40,70,120,.16); color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:600 17px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.1}
.top{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
.brand{display:flex;align-items:center;gap:8px;font:600 15px var(--display);letter-spacing:.14em}
.brand svg{width:22px;height:22px}
.brand .chl{letter-spacing:0;font-weight:800;font-size:14px;white-space:nowrap}
.seg{display:flex;background:var(--surface2);border-radius:99px;padding:3px}
.seg button{min-width:44px;min-height:34px;border-radius:99px;font:800 13px var(--body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hero{background:var(--surface);border-radius:28px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.hero .kick{font:800 13px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}
.hero h1{font-size:34px}
.hero p{margin:6px 0 0;color:var(--muted);font-weight:700}
.bubble{width:96px;height:96px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.bubble svg{width:76%;height:76%}
.bubble.sm{width:46px;height:46px}.bubble.md{width:64px;height:64px}
.first{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.first h2{font-size:22px}
.first ol{margin:0;padding-left:1.2em;font-weight:800}
.first button{align-self:flex-start;background:var(--accent-ink);color:var(--accent);border-radius:99px;padding:10px 20px;min-height:44px;font-weight:800}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:18px;background:var(--surface);min-height:72px;font:800 12px var(--body);color:var(--muted)}
.dayb svg{width:30px;height:30px}
.dayb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dayb.today:not([aria-pressed="true"]){box-shadow:inset 0 0 0 2px var(--accent)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dayhead h2{font-size:24px}
.dayhead span{color:var(--muted);font-weight:800;font-size:14px}
.tl{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:1fr;gap:4px;align-items:stretch}
.t{font:700 13px var(--display);padding:6px 4px 0;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:22px;padding:12px 14px;min-height:72px}
.card .tx{min-width:0;flex:1}
.card b{display:block;font:600 19px/1.15 var(--display)}
.card small{display:block;color:var(--muted);font-weight:700;font-size:14px;margin-top:2px}
.card .go{color:var(--muted);font-size:22px;flex:none}
.rw.now .card{box-shadow:0 0 0 3px var(--accent)}
.rw.now .t{color:var(--accent-text)}
.rw.past{opacity:.5}
.rw.past .card{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.flag{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:99px;font:800 12px var(--body);padding:2px 10px;margin-bottom:4px}
.card.task{background:var(--surface2);border-radius:18px;min-height:0;cursor:default}
.card.task svg{width:28px;height:28px;flex:none}
.card.task b{font:800 16px/1.25 var(--body)}
.card.shop{background:var(--okbg)}
.cta{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 55%,transparent);z-index:5}
.cta button{pointer-events:auto;width:100%;max-width:520px;min-height:60px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font:600 20px var(--display);box-shadow:var(--shadow)}
.foot{color:var(--muted);font-size:13px;font-weight:700;text-align:center;display:flex;flex-direction:column;gap:6px;padding:8px 0 4px}
.foot b{color:var(--fg);font-family:var(--display);font-weight:500;font-size:14px}
/* sheets */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);pointer-events:none;max-height:94%}
.sheet.on{transform:none;pointer-events:auto}
.sheet .in{width:100%;max-width:560px;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:30px 30px 0 0;box-shadow:var(--shadow);
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.grab{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.grab::before{content:"";position:absolute;left:50%;top:6px;width:44px;height:5px;margin-left:-22px;border-radius:9px;background:var(--line)}
.x{width:48px;height:48px;border-radius:50%;background:var(--surface2);font-size:22px;margin-left:auto}
.rh{display:flex;gap:14px;align-items:center}
.rh h2{font-size:28px}
.swap{display:inline-block;margin-top:6px;background:var(--badbg);color:var(--bad);border-radius:99px;padding:3px 12px;font:800 13px var(--body)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--surface);border-radius:18px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.fact b{font:600 22px var(--display)}
.fact span{font-size:12px;color:var(--muted);font-weight:800}
.eat{background:var(--okbg);color:var(--ok);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.eat b{font:600 21px/1.2 var(--display);color:var(--fg)}
.eat span{font-weight:800;font-size:15px}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:22px;padding:10px 12px 10px 16px}
.who small{display:block;color:var(--muted);font-size:13px;font-weight:700}
.step{display:flex;gap:10px;align-items:center}
.step button{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 26px var(--display)}
.step output{min-width:44px;text-align:center;font:600 24px var(--display);font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{font-size:20px}
.chk{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.chk label{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 14px;min-height:52px;cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;width:28px;height:28px;border-radius:9px;border:2.5px solid var(--muted);flex:none;display:grid;place-items:center;margin:0;background:transparent}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";width:8px;height:14px;border:solid var(--accent-ink);border-width:0 3.5px 3.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk .nm{flex:1;min-width:0}
.chk .am{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.chk li.done .nm{text-decoration:line-through;opacity:.55}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border-radius:20px;padding:14px 16px 14px 56px;position:relative;font-size:18px}
.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 17px var(--display)}
.steps b{color:var(--accent-text);font-weight:800}
.note{background:var(--surface);border-radius:20px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-weight:700}
.note svg{width:30px;height:30px;flex:none}
details.more{background:var(--surface);border-radius:20px;padding:4px 16px}
details.more summary{min-height:52px;display:flex;align-items:center;cursor:pointer;font:600 18px var(--display);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";margin-left:auto;font-size:26px;color:var(--muted)}
details.more[open] summary::after{content:"–"}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:2px 0 12px}
.nut div{background:var(--surface2);border-radius:14px;padding:8px 4px;text-align:center;display:flex;flex-direction:column}
.nut b{font:600 20px var(--display)}.nut span{font-size:12px;color:var(--muted);font-weight:800}
.why{margin:0 0 12px;color:var(--muted);font-weight:700;font-size:16px}
.big{background:var(--surface);border-radius:28px;padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.big .eur{font:600 52px/1 var(--display);color:var(--accent-text);font-variant-numeric:tabular-nums}
.big p{margin:0;color:var(--muted);font-weight:800;font-size:15px}
.bar{height:10px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.aisle{display:flex;align-items:center;gap:8px}
.aisle h3{font-size:20px}.aisle small{margin-left:auto;color:var(--muted);font-weight:800}
.chk .pk{display:block;color:var(--muted);font-size:13px;font-weight:700}
.join{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:4px 6px 10px}
.join h2{font:700 26px var(--display);margin:4px 0 0}
.join p{margin:0;color:var(--muted)}
.join ul{list-style:none;margin:4px 0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.join li{padding:12px 14px;border-radius:18px;background:var(--surface2);font-weight:600}
.join a{display:flex;align-items:center;justify-content:center;width:100%;text-decoration:none}
.btn2{min-height:52px;border-radius:99px;background:var(--surface2);font:600 18px var(--display);padding:0 22px}
.sm-note{color:var(--muted);font-size:13px;font-weight:700}
.sm-note a{color:var(--accent-text)}
.chk .am{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.chk .am b{font:600 20px var(--display)}
.chk label:has(.am:only-child){cursor:default}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);border-radius:99px;padding:10px 22px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tl>li{list-style:none}
@media (prefers-reduced-motion:reduce){.sheet,.veil,.bar i{transition:none}}
@media (max-width:360px){.hero h1{font-size:28px}.bubble{width:76px;height:76px}}
/* Nov 8 2026: the app's glass and backdrop */
body{background:radial-gradient(ellipse 90% 60% at 50% 0%,#0d2a5e 0%,#071636 45%,var(--bg) 100%) fixed,var(--bg)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) body{background:var(--bg)}}
.hero,.card,.dayb,.big,.sec .chk li,.who{border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.cta button{background:var(--pill);color:var(--pill-ink);border:1px solid rgba(255,255,255,.6)}
.first{background:linear-gradient(160deg,rgba(143,231,255,.22),rgba(80,140,255,.16));color:var(--fg);border:1px solid var(--line)}
.first button{background:var(--pill);color:var(--pill-ink)}
.topr{display:flex;align-items:center;gap:8px}
.shr{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line)}
.shr svg{width:20px;height:20px}
.in-app .cta{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
.in-app body{padding-bottom:190px}
.in-app .sheet .in{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
.btnapp{min-height:56px;border-radius:99px;background:var(--pill);color:var(--pill-ink);font:700 18px var(--display);padding:0 22px;border:1px solid rgba(255,255,255,.6)}
</style>

</head>

<script>
document.getElementById('sheet-r').inert = true; document.getElementById('sheet-l').inert = true; document.getElementById('sheet-j').inert = true;
/* Fakeaway week: all data and the pure math, shared by the page and check.cjs. */
(function (root) {
'use strict';

/* Shopping items. pack = what you buy (g, or pieces for eggs), price in EUR.

   nm = noun [singular, plural] used in recipe steps. */
const ITEMS = {

  if (it === 'eggs') { const n = Math.max(1, Math.ceil(q - 1e-9)); return { am: n + ' ' + nm[n > 1 ? 1 : 0], noun: true }; }
  if (I.show === 'none') return { am: '', noun: true, name: nm[0] };
  if (I.show === 'tsp') {
    if (q >= 3) { const v = Math.max(1, Math.round(q / 3 * 2) / 2); return { am: frac(v, FR4).txt + ' ' + t.tbsS, noun: false }; }
    return { am: frac(q, FR4).txt + ' ' + t.tspS, noun: false };
  }
  if (I.show === 'spoon') {
    if (q <= 120) return { am: frac(Math.max(.5, Math.round(q / I.spoonG * 2) / 2), FR4).txt + ' ' + t.spoonS, noun: false };
    return { am: gramTxt(q), noun: false };
  }
  if (I.show === 'pc') { const f = frac(q / I.pc, FR4); return { am: f.txt + ' ' + nm[f.val > 1 ? 1 : 0], noun: true }; }
  if (I.show === 'leaf') { const n = Math.max(1, Math.ceil(q / I.pc - 1e-9)); return { am: n + ' ' + nm[n > 1 ? 1 : 0], noun: true }; }
  if (I.show === 'clove') { const f = frac(Math.max(.5, Math.round(q / I.pc * 2) / 2), FR4); return { am: f.txt + ' ' + nm[f.val > 1 ? 1 : 0], noun: true }; }
  if (I.show === 'lemon') {
    if (q < 8) return { am: t.pinch + ' ' + t.lemonN[0], noun: true };
    const f = frac(q / I.pc, FR4); return { am: f.txt + ' ' + t.lemonN[f.val > 1 ? 1 : 0], noun: true };
  }
  if (I.show === 'head') { const f = frac(q / I.pack, FR4); return { am: about() + ' ' + gramTxt(q) + ' (' + f.txt + ' ' + t.headOf + ')', noun: false }; }
  return { am: gramTxt(q), noun: false };
}

/* ---------- recipe text ---------- */
const PIECES = { pancakes: 4, nuggets: 6 };
function stepHtml(s, id, P, tm) {
  const r = F.RECIPES[id], t = T();
  return esc(s).replace(/\{(\w+)(?:\*([\d.]+))?\}/g, (m, k, mul) => {
    if (k === 'leftover') return esc(LEFT_TIP[L()]._ + (LEFT_TIP[L()][id] || ''));
    if (k === 'trays') { const n = Math.max(1, Math.ceil(P * tm / (r.perTray || 4) - 1e-9)); return '<b>' + n + ' ' + t.pcs.tray[n > 1 ? 1 : 0] + '</b>'; }
    if (k === 'pieces') { const n = Math.round(PIECES[id] * P * tm); return '<b>' + about() + ' ' + n + '</b>'; }
    const e = r.ing.find(x => x[0] === k); if (!e) return k;
    const f = fmt(k, e[1] * P * tm * (mul ? parseFloat(mul) : 1)), I = F.ITEMS[k];
    if (f.name) return f.name;
    return f.noun ? '<b>' + esc(f.am) + '</b>' : '<b>' + esc(f.am) + '</b> ' + esc(I.nm[L()][0]);
  });
}
const startTime = (day) => {
  const s = day.slots.find(x => F.RECIPES[x[1]] && F.RECIPES[x[1]].slot === 'dinner'); if (!s) return null;
  const m = 18 * 60 - F.RECIPES[s[1]].min; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
};
const hm = s => +s.slice(0, 2) * 60 + +s.slice(3);
/* Nov 8 2026 (Emmanuel: "We shouldn't lock in the time ... morning, brunch, evening, nighttime ... or snack. So people don't feel
   fixed"): the plan keeps its order by the old times, but shows a part of the day instead of a clock time */
function slotOf(time, kind) {
  if (kind === 'thaw') return 'night';
  if (kind === 'shop') return 'forenoon';
  const m = hm(time);
  return m < 600 ? 'morning' : m < 720 ? 'brunch' : m < 900 ? 'midday' : m < 1020 ? 'snack' : 'evening';
}

  const c = e.target; if (c.dataset && c.dataset.it) {
    st.checks[c.dataset.it] = c.checked; save(); c.closest('li').classList.toggle('done', c.checked);
    const b = F.basket(st.people, 0), n = b.rows.length, d = b.rows.filter(r => st.checks[r.it]).length;
    $('#barfill').style.width = Math.round(d / n * 100) + '%'; $('#barlabel').textContent = T().inBasket(d, n);
  } else if (c.type === 'checkbox') c.closest('li').classList.toggle('done', c.checked);
});
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('more') && cur.sheet === 'r') cur.more = e.target.open; }, true);
}
window.FAWAPP = { fmt, stepHtml, startTime, frac, FR4, eur, eur0, ppl, about, st, slotOf, hm, gramTxt };
if (!window.FAW_PRINT && !window.FAW_HEADLESS) {
render();
setInterval(() => { if (!cur.sheet) render(); }, 60000);
}
})();
