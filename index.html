<title>LOWiSPIKE</title>
<style>
:root{--bg:#03050a;--panel:rgba(20,23,32,.72);--panel2:rgba(30,33,45,.85);--line:rgba(202,161,90,.22);--line2:rgba(255,255,255,.07);--gold:#caa15a;--gold2:#ecd08f;--text:#f8f5ed;--muted:#a19c90;--dim:#6d695f;--hi:#f0a08a;--mid:#e6c98a;--lo:#a9dcb2;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:radial-gradient(120% 60% at 50% -10%,rgba(202,161,90,.16),transparent 60%),var(--bg)}
.num{font-variant-numeric:tabular-nums}
.h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.h3{font-size:16px;font-weight:650}
.muted{color:var(--muted)}.dim{color:var(--dim)}.gold{color:var(--gold2)}
.small{font-size:13px;line-height:1.45}.tiny{font-size:11px;letter-spacing:.07em;text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:22px;padding:16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card.goldline{border-color:var(--line)}
.btn{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;font-weight:650;font-size:16px;width:100%;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#e2c27e,#b98d45);color:#14100a;box-shadow:0 8px 30px rgba(202,161,90,.25)}
.btn.ghost{border:1px solid var(--line);color:var(--gold2);background:rgba(202,161,90,.06)}
.btn.sm{height:42px;font-size:14.5px;border-radius:21px}
.btn[disabled]{opacity:.35;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-size:14px;white-space:nowrap;transition:all .15s}
.chip.on{background:rgba(202,161,90,.16);border-color:var(--gold);color:var(--gold2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}.hscroll::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.badge.ja{background:rgba(160,220,170,.13);color:var(--lo)}.badge.selten{background:rgba(236,208,143,.13);color:var(--mid)}.badge.nein{background:rgba(255,120,90,.13);color:var(--hi)}.badge.mine{background:rgba(200,140,255,.14);color:#d3b0ff}
.badge.demo{background:rgba(202,161,90,.12);color:var(--gold2);border:1px solid var(--line)}
.badge.ver{background:linear-gradient(180deg,#e2c27e,#b98d45);color:#14100a}
.badge.spon{background:rgba(255,255,255,.08);color:#cfd3dc;border:1px dashed rgba(255,255,255,.3)}
.badge.fail{background:rgba(255,120,90,.1);color:var(--hi)}
.av{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;background:#1b1d26;border:2px solid var(--gold);overflow:hidden;color:var(--gold2)}
.av img{width:100%;height:100%;object-fit:cover}
.hidden{display:none!important}
.screen{position:absolute;inset:0}
.stack>*+*{margin-top:14px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec .h3{font-size:17px}
.toggle{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.12);position:relative;flex:none;transition:background .2s}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--gold)}.toggle.on:after{transform:translateX(20px)}
.input{width:100%;height:50px;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.05);padding:0 16px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.input:focus{border-color:var(--gold)}
input[type=date].input{display:flex;align-items:center;color-scheme:dark}
.field{display:block;margin-top:14px}.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 7px 4px}
.lockline{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:rgba(202,161,90,.07);border:1px solid var(--line);font-size:13.5px;color:#ddd5c4;line-height:1.4}
.lockline svg{width:18px;height:18px;flex:none;color:var(--gold2);margin-top:1px}
/* onboarding */
#onboard{z-index:40;background:var(--bg)}
.ob-track{display:flex;width:300%;height:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.ob-page{width:33.3333%;height:100%;position:relative;display:flex;flex-direction:column;padding:calc(var(--sat) + 24px) 24px calc(var(--sab) + 24px);overflow-y:auto}
.ob-hero{position:absolute;inset:0;background-size:cover;background-position:center 30%}
.ob-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,5,10,.25) 0%,rgba(3,5,10,.1) 35%,rgba(3,5,10,.85) 62%,#03050a 80%)}
.langpick{display:inline-flex;gap:2px;padding:3px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(191,227,255,.05));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.langbtn{appearance:none;border:0;background:transparent;color:var(--muted);font:600 12px/1 inherit;letter-spacing:.08em;padding:7px 10px;border-radius:999px;cursor:pointer;font-family:inherit}
.langbtn.on{color:#14110b;background:linear-gradient(120deg,#f3dda6,#cfe8ff 55%,#ecd2ff)}
.wordmark{font-weight:800;letter-spacing:.32em;font-size:15px;color:var(--gold2)}.wordmark i{font-style:normal;color:var(--text)}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0 14px}.dots span{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);transition:all .3s}.dots span.on{width:20px;background:var(--gold)}
/* main + tabs */
#main{position:absolute;inset:0}
.tab{position:absolute;inset:0;bottom:calc(70px + var(--sab));overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 16px) 18px 30px;opacity:0;pointer-events:none;transition:opacity .22s}
.tab.active{opacity:1;pointer-events:auto}
#tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(70px + var(--sab));padding-bottom:var(--sab);display:flex;align-items:center;justify-content:space-around;background:rgba(6,8,13,.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line2);z-index:10}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--dim);width:64px;transition:color .2s}
.tb svg{width:24px;height:24px}.tb.active{color:var(--gold2)}
.tb.scan{margin-top:-28px}
.tb.scan .ring{width:60px;height:60px;border-radius:50%;background:linear-gradient(180deg,#e2c27e,#b0843d);display:flex;align-items:center;justify-content:center;color:#14100a;box-shadow:0 6px 24px rgba(202,161,90,.45),0 0 0 5px var(--bg)}
.tb.scan .ring svg{width:28px;height:28px}
/* header */
.topbar{display:flex;align-items:center;gap:12px}
.lvchip{margin-left:auto;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(202,161,90,.08);color:var(--gold2);font-weight:700;font-size:13.5px}
.lvchip.pulse{animation:pulse .7s}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.15);box-shadow:0 0 24px rgba(236,208,143,.6)}100%{transform:scale(1)}}
.zod{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(202,161,90,.14);color:var(--gold2);font-size:12px;margin-left:4px;vertical-align:1px}
/* streak */
.streak{position:relative;overflow:hidden}
.streak .flame{font-size:40px;line-height:1;filter:drop-shadow(0 0 14px rgba(255,170,80,.55))}
.streak.cold .flame{filter:grayscale(1);opacity:.5}
.streak .big{font-size:34px;font-weight:800;letter-spacing:-.02em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.wd i{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px}
.wd.done i{background:linear-gradient(180deg,#f3c86f,#d98b3a);border-color:transparent;color:#1a1208}
.wd.frz i{background:rgba(140,190,255,.16);border-color:rgba(140,190,255,.5)}
.wd.today i{border-color:var(--gold);box-shadow:0 0 0 3px rgba(202,161,90,.18)}
.wd.today{color:var(--gold2)}
.mbar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}.mbar b{display:block;height:100%;background:linear-gradient(90deg,#b98d45,#ecd08f);border-radius:3px;transition:width .8s}
.burst{position:absolute;inset:0;pointer-events:none}
.burst span{position:absolute;left:50%;top:45%;width:8px;height:8px;border-radius:2px;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(320deg);opacity:0}}
/* eat composer */
.eat textarea{width:100%;min-height:58px;max-height:140px;resize:none;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.05);padding:14px 16px;font-size:17px;outline:none;line-height:1.35}
.eat textarea:focus{border-color:var(--gold)}
.camb{width:50px;height:50px;border-radius:25px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:rgba(202,161,90,.08);color:var(--gold2)}
.camb svg{width:24px;height:24px}
.sos{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border-radius:22px;border:1px solid rgba(240,160,138,.35);background:linear-gradient(135deg,rgba(240,120,110,.16),rgba(202,161,90,.08))}
.sos .ic{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(240,160,138,.18);font-size:22px}
/* quests */
.quest{display:flex;align-items:center;gap:14px;padding:13px 2px;border-top:1px solid var(--line2);width:100%;text-align:left}
.quest:first-child{border-top:0}
.qcheck{width:28px;height:28px;border-radius:50%;border:2px solid rgba(202,161,90,.5);flex:none;display:flex;align-items:center;justify-content:center;transition:all .25s}
.qcheck svg{width:15px;height:15px;opacity:0;color:#14100a}
.quest.done .qcheck{background:var(--gold);border-color:var(--gold)}.quest.done .qcheck svg{opacity:1}
.quest.done .qt{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(202,161,90,.5)}
.xpp{margin-left:auto;font-size:12px;font-weight:700;color:var(--gold2);flex:none}
/* overlays */
.overlay{position:absolute;inset:0;z-index:25;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 12px) 18px calc(var(--sab) + 28px);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.overlay.open{transform:none}
.ovhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.xbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;flex:none}
.xbtn svg{width:18px;height:18px}
#sheetwrap{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#sheetwrap.open{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:#0d1017;border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:10px 18px calc(var(--sab) + 22px);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#sheetwrap.open #sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:0 auto 14px}
#toast{position:absolute;left:50%;top:calc(var(--sat) + 14px);transform:translate(-50%,-140%);z-index:60;background:rgba(24,22,16,.96);border:1px solid var(--line);color:var(--gold2);padding:11px 18px;border-radius:999px;font-weight:650;font-size:14.5px;transition:transform .35s cubic-bezier(.2,.8,.2,1);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.show{transform:translate(-50%,0)}
/* result */
.plate{display:flex;align-items:center;gap:14px}
.plate .pic{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:34px;flex:none;overflow:hidden}
.plate .pic img{width:100%;height:100%;object-fit:cover}
.spike svg{width:100%;height:auto;display:block}
.spike .curve{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.7s cubic-bezier(.4,.1,.2,1) .25s forwards}
.spike .swapc{fill:none;stroke:var(--lo);stroke-width:2.2;stroke-dasharray:5 6;opacity:0;animation:fade .6s ease 1.9s forwards}
.spike .area{opacity:0;animation:fade .8s ease 1.2s forwards}
.spike .dot{opacity:0;animation:fade .3s ease 1.9s forwards}
.spike .dot circle.pul{animation:pul 1.6s ease-out 2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes pul{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
.lvl{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;font-weight:800;letter-spacing:.06em;font-size:14px;opacity:0;transform:scale(.7);animation:pop .45s cubic-bezier(.2,1.4,.4,1) 1.85s forwards}
.lvl.high{background:rgba(240,160,138,.16);color:var(--hi)}.lvl.medium{background:rgba(230,201,138,.16);color:var(--mid)}.lvl.low{background:rgba(169,220,178,.16);color:var(--lo)}
@keyframes pop{to{opacity:1;transform:none}}
.est{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:#cfd3dc}
.blk{margin-top:14px}.blk .tiny{color:var(--gold2);margin-bottom:7px}
.blk ul{list-style:none}.blk li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.45;color:#e4ded0}.blk li+li{margin-top:6px}
.blk li:before{content:"";position:absolute;left:3px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.swapcard{border-radius:22px;padding:16px;background:linear-gradient(160deg,rgba(169,220,178,.10),rgba(202,161,90,.07));border:1px solid rgba(169,220,178,.28)}
.itemchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ichip{font-size:12.5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.ichip.ja{border-color:rgba(169,220,178,.35)}.ichip.selten{border-color:rgba(230,201,138,.4)}.ichip.nein{border-color:rgba(240,160,138,.4)}
/* scan */
.camzone{position:relative;border-radius:26px;overflow:hidden;height:300px;background:#0b0e15;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.camzone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camzone .frame{position:absolute;inset:26px;border-radius:20px;border:2px solid rgba(236,208,143,.5)}
.scanline{position:absolute;left:0;right:0;height:70px;top:-70px;background:linear-gradient(180deg,transparent,rgba(236,208,143,.35),transparent);animation:sweep 1.4s linear infinite}
@keyframes sweep{to{top:100%}}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mtile{border-radius:18px;padding:12px 6px;text-align:center;background:var(--panel);border:1px solid var(--line2);font-size:12.5px;line-height:1.25}
.mtile .e{font-size:28px;display:block;margin-bottom:5px}
/* community */
.post{padding:14px 0;border-top:1px solid var(--line2)}
.post:first-child{border-top:0}
.post .ph{margin-top:10px;border-radius:16px;overflow:hidden;max-height:260px}.post .ph img{width:100%;display:block}
.pact{display:flex;gap:8px;margin-top:10px}
.pact button{font-size:13px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--muted)}
.pact button.on{color:var(--gold2);border-color:var(--line);background:rgba(202,161,90,.12)}
/* brands */
.brand{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.brand:first-child{border-top:0}
.brand .lg{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
/* glow */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.scale button{height:46px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line2);font-size:21px;transition:all .15s}
.scale button.on{background:rgba(202,161,90,.18);border-color:var(--gold);transform:scale(1.05)}
.gbars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.gbar{text-align:center;font-size:11.5px;color:var(--muted)}
.gbar .col{height:64px;border-radius:10px;background:rgba(255,255,255,.05);position:relative;overflow:hidden;margin-bottom:6px}
.gbar .col b{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#b98d45,#ecd08f);border-radius:10px;transition:height .8s}
.gbar .col s{position:absolute;left:4px;right:4px;height:2px;background:rgba(255,255,255,.55);text-decoration:none}
/* profile */
.xpcurve{display:flex;align-items:flex-end;gap:5px;height:84px;margin-top:12px}
.xpcurve div{flex:1;border-radius:6px 6px 2px 2px;background:rgba(202,161,90,.25);position:relative}
.xpcurve div.me{background:linear-gradient(0deg,#b98d45,#ecd08f)}
.xpcurve span{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim)}
.stat{flex:1;text-align:center;padding:12px 4px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line2)}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:11.5px;color:var(--muted)}
.setrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line2)}
.setrow:first-child{border-top:0}
.setrow .t{flex:1}

/* ===== Tribe module: For You, Tribe Originals, Streak Shield, Tribe Raids =====
   Liquid glass + soft holographic film on the existing dark & gold. Everything prefixed tr-. */
@property --tra{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--holo:linear-gradient(115deg,#ecd08f 0%,#f2bccb 26%,#c3b2ff 50%,#a6e4ea 74%,#ecd08f 100%);--glass:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.018));--glassline:rgba(255,255,255,.09)}
.tr-row{display:flex;align-items:center;gap:12px}
.tr-holo-t{background:var(--holo);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:trfilm 7s linear infinite}
@keyframes trfilm{to{background-position:220% 0}}
#tab-foryou{background:radial-gradient(90% 34% at 105% -4%,rgba(195,178,255,.09),transparent 62%),radial-gradient(80% 30% at -10% 6%,rgba(166,228,234,.06),transparent 60%)}

/* header pill: no algorithm */
.tr-chrono{display:inline-flex;align-items:center;gap:7px;flex:none;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(202,161,90,.06);font-size:11.5px;font-weight:650;color:var(--gold2);letter-spacing:.02em}
.tr-chrono i{width:6px;height:6px;border-radius:50%;background:var(--gold2);box-shadow:0 0 8px var(--gold2);animation:trdot 2.4s ease-in-out infinite}
@keyframes trdot{50%{opacity:.35}}

/* liquid-glass share bar */
.tr-compose{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:24px;background:var(--glass);border:1px solid var(--glassline);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 14px 34px -22px rgba(202,161,90,.7);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);position:relative;overflow:hidden;transition:transform .12s}
.tr-compose:active{transform:scale(.985)}
.tr-compose:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.06) 48%,rgba(195,178,255,.05) 54%,transparent 66%);background-size:300% 100%;animation:trglide 6s ease-in-out infinite;pointer-events:none}
@keyframes trglide{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.tr-compose .pl{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#e9cb88,#b08540);color:#14100a;box-shadow:0 6px 18px rgba(202,161,90,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.tr-compose .pl svg{width:20px;height:20px}
.tr-pi{display:flex;gap:8px;color:var(--dim)}.tr-pi svg{width:17px;height:17px}

/* raid strip at the top of the feed */
.tr-raidstrip{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:20px;background:var(--panel);border:1px solid var(--line2);text-align:left}
.tr-raidstrip .e{font-size:22px;flex:none}
.tr-raidstrip .tr-liq{margin-top:7px;height:6px}

/* posts */
.tr-post{position:relative;isolation:isolate;padding:14px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.tr-ph{display:flex;align-items:center;gap:10px}
.tr-nm{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-nm .rk{font-size:13px}
.tr-lockt{display:inline-flex;align-items:center;gap:3px}.tr-lockt svg{width:11px;height:11px}
.tr-cap{font-size:15.5px;line-height:1.42;margin:10px 2px 0;color:#efeadf}
.tr-link{display:block;width:100%;text-align:left;margin-top:10px;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.03);border:1px solid var(--line2);transition:transform .12s}
.tr-link:active{transform:scale(.99)}
.tr-media{position:relative;width:100%;max-height:300px;overflow:hidden;background:#0c0e15}
.tr-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tr-art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(70% 60% at 28% 22%,hsl(var(--h1) 62% 58% / .5),transparent 62%),radial-gradient(65% 60% at 82% 88%,hsl(var(--h2) 55% 52% / .45),transparent 60%),linear-gradient(160deg,#141722,#0a0b11)}
.tr-art:after{content:"";position:absolute;left:-20%;top:-30%;width:70%;height:60%;border-radius:50%;background:radial-gradient(rgba(255,255,255,.12),transparent 65%);filter:blur(8px)}
.tr-art span{font-size:66px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.45))}
.tr-plat{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:5px;padding:5px 9px 5px 7px;border-radius:999px;background:rgba(8,9,14,.55);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:11.5px;font-weight:650;z-index:2}
.tr-plat svg{width:13px;height:13px}
.tr-play{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);z-index:2}
.tr-play svg{width:22px;height:22px;margin-left:3px;color:#fff}
.tr-lk{padding:10px 12px 12px}
.tr-ttl{font-size:14.5px;font-weight:600;line-height:1.36;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tr-tags{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 9px}.tr-tags span{font-size:12.5px;color:var(--gold2);opacity:.8}
.tr-acts{display:flex;align-items:center;gap:6px;margin-top:10px}
.tr-heart{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line2);font-size:14px;color:var(--muted);transition:color .2s,border-color .2s}
.tr-heart svg{width:18px;height:18px}
.tr-heart.on{color:#f3b2c0;border-color:rgba(243,178,192,.35)}.tr-heart.on svg{fill:currentColor}
.tr-heart.pop svg{animation:trpop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes trpop{40%{transform:scale(1.35)}}
.tr-open{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--gold2);padding:7px 4px}
.tr-open svg{width:15px;height:15px}
.tr-more{width:34px;height:34px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tr-more svg{width:20px;height:20px}
.tr-new{animation:trnew 1.8s ease}
@keyframes trnew{0%{box-shadow:0 0 0 0 rgba(236,208,143,.0)}25%{box-shadow:0 0 0 3px rgba(236,208,143,.35),0 0 40px rgba(236,208,143,.25)}100%{box-shadow:0 0 0 0 rgba(236,208,143,0)}}

/* ===== Tribe Original: iridescent glass, shifting holographic edge, sharp corner badge ===== */
.tr-post.orig,.tr-prev.orig{background:linear-gradient(115deg,transparent 28%,rgba(195,178,255,.055) 42%,rgba(166,228,234,.05) 52%,rgba(242,188,203,.045) 60%,transparent 74%) 0 0/260% 100%,linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.018));animation:trfilmbg 9s ease-in-out infinite;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 18px 44px -24px rgba(195,178,255,.55),0 10px 30px -22px rgba(166,228,234,.5);border-color:transparent}
@keyframes trfilmbg{0%,100%{background-position:100% 0,0 0}50%{background-position:0 0,0 0}}
.tr-post.orig:before,.tr-prev.orig:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;background:conic-gradient(from var(--tra),#ecd08f,#f2bccb,#c3b2ff,#a6e4ea,#c9efd6,#ecd08f);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:.75;animation:trspin 9s linear infinite;pointer-events:none;z-index:1}
@keyframes trspin{to{--tra:360deg}}
.tr-badge{position:absolute;top:12px;right:12px;z-index:3;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px 0 7px;border-radius:7px;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;border:1px solid transparent;background:linear-gradient(#0d0f17,#0d0f17) padding-box,var(--holo) border-box;background-size:auto,220% 100%;animation:trfilmb 7s linear infinite;box-shadow:0 4px 14px -6px rgba(195,178,255,.6)}
.tr-badge svg{width:10px;height:10px;color:#e9dcff;flex:none}
.tr-badge{color:#f1ead8}
@keyframes trfilmb{to{background-position:0 0,220% 0}}
.tr-post.orig .tr-ph{padding-right:136px}
.tr-gemc{display:inline-flex;color:#d6c8ff}.tr-gemc svg{width:12px;height:12px}
.toggle.holo.on{background:linear-gradient(120deg,#ecd08f,#f2bccb,#c3b2ff,#a6e4ea)}

/* composer */
.tr-urlrow{display:flex;gap:8px;margin-top:14px}
.tr-urlrow .input{font-size:16px}
.tr-paste{flex:none;display:inline-flex;align-items:center;gap:6px;height:52px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:rgba(202,161,90,.06);color:var(--gold2);font-weight:600;font-size:14.5px}
.tr-paste svg{width:16px;height:16px}
.tr-prev{position:relative;isolation:isolate;margin-top:14px;border-radius:20px;overflow:hidden;background:rgba(255,255,255,.03);border:1px solid var(--line2)}
.tr-prev .tr-media{max-height:220px}

.tr-shim{position:absolute;inset:0;background:linear-gradient(100deg,#11131b 30%,#1b1e29 50%,#11131b 70%);background-size:300% 100%;animation:trshim 1.3s linear infinite}

.tr-auto{display:flex;align-items:flex-start;gap:8px;margin-top:10px;color:var(--muted);line-height:1.4}

.tr-auto.warn{color:#e6c98a;background:rgba(236,208,143,.07);border:1px solid rgba(236,208,143,.2);padding:10px 12px;border-radius:14px}

/* liquid progress bar */
.tr-liq{position:relative;height:10px;border-radius:999px;background:rgba(255,255,255,.06);box-shadow:inset 0 1px 2px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.04);overflow:hidden}
.tr-liq.big{height:18px}
.tr-liq-fill{position:relative;height:100%;border-radius:inherit;background:linear-gradient(90deg,#9f7433,#d9b56a 45%,#f1dca6 78%,#dccbff);box-shadow:0 0 18px rgba(226,194,126,.45);overflow:hidden;animation:trgrow 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes trgrow{from{clip-path:inset(0 100% 0 0 round 999px)}to{clip-path:inset(0 0 0 0 round 999px)}}
.tr-liq-fill:before{content:"";position:absolute;left:0;right:0;top:0;height:50%;border-radius:999px 999px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0))}
.tr-liq-fill .sheen{position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.55) 45%,transparent 62%);transform:translateX(-100%);animation:trsheen 3.6s ease-in-out 1.2s infinite}
@keyframes trsheen{0%{transform:translateX(-100%)}55%,100%{transform:translateX(100%)}}
.tr-liq-fill .edge{position:absolute;right:-5px;top:-60%;width:14px;height:220%;border-radius:50%;background:radial-gradient(rgba(255,246,220,.95),transparent 65%);filter:blur(2px);animation:trbob 2.2s ease-in-out infinite}
@keyframes trbob{50%{transform:translateY(12%) scaleY(.85)}}
.tr-liq .tk{position:absolute;top:0;bottom:0;width:1.5px;background:rgba(255,255,255,.13);z-index:2}
.tr-liq .tk.hit{background:rgba(20,16,10,.35)}
.tr-ms{position:relative;height:18px;margin-top:6px}
.tr-ms span{position:absolute;transform:translateX(-50%)}
.tr-ms span:nth-child(1){left:25%}.tr-ms span:nth-child(2){left:50%}.tr-ms span:nth-child(3){left:75%}.tr-ms span:nth-child(4){right:0;transform:none}

/* liquid orb */
.tr-orb{position:relative;flex:none;filter:drop-shadow(0 8px 22px rgba(202,161,90,.25))}
.tr-orb svg{width:100%;height:100%;display:block}
.tr-orb .bgc{fill:rgba(255,255,255,.04)}
.tr-orb .rim{fill:none;stroke:rgba(255,255,255,.2);stroke-width:1.2}
.tr-orb .gloss{fill:rgba(255,255,255,.16)}
.tr-orb .wv{animation:trwave 3.4s linear infinite}
.tr-orb .wv2{animation-duration:5.2s;animation-direction:reverse}
@keyframes trwave{from{transform:translateX(0)}to{transform:translateX(-50px)}}
.tr-orb .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.tr-orb .in b{font-size:15px;font-weight:800;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.55)}

.tr-raidhero .tr-orb .in b{font-size:30px}
.tr-raidcard{position:relative;overflow:hidden}
.tr-raidcard:after{content:"";position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(rgba(195,178,255,.12),transparent 65%);pointer-events:none}
.tr-you{background:var(--glass);border-color:var(--glassline)}

/* streak shield */
.tr-shrow{display:inline-flex;gap:3px;flex:none}
.tr-sh{width:22px;height:22px}
.tr-shrow.sm .tr-sh{width:14px;height:14px}
.tr-shrow.lg .tr-sh{width:42px;height:42px}
.tr-shrow.lg{gap:8px}
.tr-sh.on path:first-child{fill:url(#trholo);filter:drop-shadow(0 0 4px rgba(195,178,255,.45))}
.tr-sh .gl{fill:rgba(255,255,255,.38)}
.tr-sh.off path:first-child{fill:none;stroke:rgba(255,255,255,.2);stroke-width:1.4}
.tr-sh.off .gl{display:none}
.tr-mini{height:4px;border-radius:2px;background:rgba(255,255,255,.07);margin-top:12px;overflow:hidden}
.tr-mini i{display:block;height:100%;border-radius:2px;background:var(--holo);background-size:200% 100%;animation:trfilm 6s linear infinite}
.tr-shcard.saved{border-color:rgba(195,178,255,.35);box-shadow:0 0 0 1px rgba(195,178,255,.12),0 14px 34px -22px rgba(195,178,255,.6)}
.tr-shhero{text-align:center;padding-top:8px}
.tr-strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:8px}
.tr-strip i{height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05)}
.tr-strip i.on{background:linear-gradient(180deg,#e2c27e,#a87c38);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tr-strip i.shield{background:rgba(195,178,255,.14);border:1px solid rgba(195,178,255,.4)}
.tr-strip i.shield .tr-sh{width:14px;height:14px}
.tr-strip i.now{border:1px dashed var(--line);background:none}
.tr-legend{display:flex;gap:14px;margin-top:8px}
.tr-legend span{display:inline-flex;align-items:center;gap:6px}
.tr-legend i{width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,.07)}
.tr-legend i.on{background:var(--gold)}.tr-legend i.shield{background:rgba(195,178,255,.5)}
.tr-streakn{font-weight:700;font-size:14px;color:var(--gold2);margin-right:4px}
.list .li.tr-me{background:rgba(202,161,90,.07);border-radius:12px;padding-left:8px;padding-right:8px;margin:0 -8px}
.tr-shbanner{background:linear-gradient(100deg,rgba(195,178,255,.14),rgba(166,228,234,.06) 60%,rgba(202,161,90,.06));border-color:rgba(195,178,255,.3)}
.tr-shi svg{width:28px;height:28px;fill:url(#trholo);flex:none;filter:drop-shadow(0 0 6px rgba(195,178,255,.5))}

@media (prefers-reduced-motion:reduce){.tr-holo-t,.tr-badge,.tr-post.orig,.tr-prev.orig,.tr-post.orig:before,.tr-prev.orig:before,.tr-liq-fill,.tr-liq-fill .sheen,.tr-liq-fill .edge,.tr-orb .wv,.tr-mini i,.tr-compose:after,.tr-chrono i{animation:none!important}}

/* LOWiSPIKE Move module styles (mv-*) */
.mv-row{display:flex;align-items:center;gap:12px}
.mv-sm{height:44px;font-size:15px;flex:1}
.mv-xs{padding:5px 11px;font-size:13px}
.mv-today .mv-open{display:flex}
.mv-rings{flex:none;transform:rotate(-90deg)}
.mv-rings circle{fill:none;stroke-width:11;stroke-linecap:round}
.mv-ringfg{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.mv-meal{display:block;width:100%;box-sizing:border-box;text-align:left;margin-top:12px;padding:12px 14px;border-radius:18px;border:1px solid var(--gold);background:linear-gradient(135deg,rgba(202,161,90,.18),rgba(202,161,90,.05))}

.mv-prompt{margin:14px 0 4px;padding:14px;border-radius:18px;border:1px solid var(--gold);background:linear-gradient(135deg,rgba(202,161,90,.16),rgba(202,161,90,.04))}

.mv-eq{margin-top:10px!important;flex-wrap:wrap;margin:0!important;padding:0!important;overflow:visible}

.mv-ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(202,161,90,.1);color:var(--gold2)}

.mv-fmt.on .mv-ic{background:linear-gradient(180deg,#e2c27e,#b98d45);color:#14100a}
.mv-hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.mv-hist:first-of-type{border-top:0}

/* full-screen Move view */
#mv-screen{position:absolute;inset:0;z-index:35;overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(120% 60% at 50% 0%,rgba(202,161,90,.10),transparent 60%),var(--bg);transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:calc(var(--sat) + 10px) 18px calc(var(--sab) + 40px)}

.mv-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}

/* player */
#mv-player{position:absolute;inset:0;z-index:37;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 30%,rgba(202,161,90,.13),transparent 65%),#05070c;padding:calc(var(--sat) + 8px) 18px calc(var(--sab) + 16px);opacity:0;pointer-events:none;transform:translateY(30px);transition:opacity .3s,transform .3s}

.mv-ptop{display:flex;align-items:center;gap:6px}
.mv-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:rgba(255,255,255,.05)}
.mv-icon svg{width:20px;height:20px}

.mv-segs{display:flex;gap:3px;margin:12px 0 4px}

.mv-segs i.rest{background:rgba(255,255,255,.04)}

.mv-segs i.rest b{background:rgba(236,208,143,.4)}
.mv-stage{position:relative;flex:1;min-height:180px;display:flex;align-items:center;justify-content:center}
#mv-fig{width:100%;height:100%;max-height:330px}
#mv-fig line{stroke-linecap:round}

#mv-fig .mv-f line{opacity:.32}

#mv-fig .belt{stroke:rgba(236,208,143,.45);stroke-width:2;stroke-dasharray:10 8}

.mv-count{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:700;color:var(--gold2);background:rgba(3,5,10,.55);opacity:0;pointer-events:none;transition:opacity .2s;font-variant-numeric:tabular-nums}
.mv-count.on{opacity:1}
.mv-info{text-align:center;margin-top:4px}
.mv-info .tiny{color:var(--gold)}

.mv-move{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-top:4px}
.mv-big{font-size:56px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:2px 0 6px;font-variant-numeric:tabular-nums}
#mv-cue{max-width:340px;margin:0 auto;color:var(--text);min-height:44px}
.mv-next{text-align:center;margin-top:10px;min-height:20px}
.mv-next b{color:var(--text)}
.mv-ctrl{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:14px}
.mv-play{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#e2c27e,#b98d45);color:#14100a;box-shadow:0 10px 34px rgba(202,161,90,.3)}

.mv-badge{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:54px;background:radial-gradient(circle,rgba(226,194,126,.3),rgba(202,161,90,.06));border:1px solid var(--gold);animation:mvpop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes mvpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

/* ===== Move: instant start + live body science ===== */
.mv-hero{padding:16px}

/* safety tip chip, not a gate */
.mv-safe{position:absolute;top:6px;left:50%;transform:translateX(-50%);max-width:calc(100% - 8px);width:max-content;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 14px;border-radius:999px;font-size:12.5px;line-height:1.35;color:rgba(255,255,255,.86);background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(var(--acc-rgb,159,216,255),.08));border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22);z-index:3;transition:opacity .5s,transform .5s;animation:mvIn .45s ease-out}

.mv-msx svg{width:13px;height:13px}

.mv-body{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:8px 14px 8px 8px;border-radius:20px;text-align:left;background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.03) 50%,rgba(var(--acc-rgb,159,216,255),.08));border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}

.mv-bodyvis.on-legs .z-legs path,.mv-bodyvis.on-arms .z-arms path,.mv-bodyvis.on-brain .z-brain circle,.mv-bodyvis.on-heart .z-torso path,.mv-bodyvis.on-all .z path,.mv-bodyvis.on-all .z circle,.mv-bodyvis.on-blood .z-torso path{stroke:var(--acc,#9fd8ff);filter:drop-shadow(0 0 4px var(--acc,#9fd8ff));animation:mvGlow 2.4s ease-in-out infinite}
@keyframes mvBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.45)}30%{transform:scale(1.05)}45%{transform:scale(1.25)}}
@keyframes mvGlow{50%{opacity:.6}}
.mv-bodytx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mv-bodytx .tiny{display:flex;justify-content:space-between;gap:8px;color:var(--acc,#9fd8ff);text-transform:uppercase;letter-spacing:.08em}
.mv-cnt{color:rgba(255,255,255,.7);text-transform:none;letter-spacing:0}
.mv-bodytx b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-tl{display:flex;gap:4px;margin-top:3px}
.mv-tl i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12);transition:background .5s,box-shadow .5s}
.mv-tl i.on{background:linear-gradient(90deg,var(--acc,#9fd8ff),var(--acc2,#d6b8ff))}
.mv-tl i.now{box-shadow:0 0 8px var(--acc,#9fd8ff);animation:mvGlow 1.6s ease-in-out infinite}
/* finish summary */
.mv-sum{margin-top:16px;width:100%;text-align:left}
.mv-sumtop{display:flex;gap:12px;align-items:flex-start}
.mv-sumimg{flex:none;width:84px;height:84px;border-radius:16px;background-size:cover;background-position:center}
.mv-sumlist{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.mv-sumrow{display:flex;gap:10px;align-items:baseline;font-size:14px;color:rgba(255,255,255,.45)}
.mv-sumrow i{flex:none;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);transform:translateY(-1px)}
.mv-sumrow.on{color:rgba(255,255,255,.92)}
.mv-sumrow.on i{background:var(--acc,#9fd8ff);box-shadow:0 0 8px var(--acc,#9fd8ff)}
.mv-done{overflow-y:auto;justify-content:flex-start;padding-top:24px;padding-bottom:12px}
@media (max-height:760px){.mv-ms .mv-msd{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.mv-big{font-size:46px}}
@media (min-width:700px){.mv-ms{left:50%;right:auto;width:min(560px,100%);transform:translate(-50%,24px) scale(.97)}.mv-ms.on{transform:translateX(-50%)}.mv-msimg{width:150px}.mv-mst{font-size:22px}.mv-msd{font-size:14.5px}.mv-body{max-width:560px;margin-left:auto;margin-right:auto}}

/* Oct 8 fix: Today 'Just ate?' card, stacked; its button no longer shares .mv-go with the Move start button */
.mv-meal-t{display:flex;align-items:center;gap:8px}.mv-meal-l{margin-top:4px;line-height:1.4}
.mv-meal-go{display:inline-flex!important;align-items:center;gap:8px;width:auto!important;min-height:40px;margin-top:10px;padding:8px 16px!important;font-size:14px;border-radius:999px}
.mv-meal-go svg{width:14px;height:14px}

/* Oct 8 fix: the milestone never covers the figure. It lives under the timer, as the 'In your body' strip expanding */
#mv-player{overflow-y:auto}
.mv-bodywrap{width:100%;max-width:560px;margin:10px auto 0;border-radius:20px;transition:background .3s}
.mv-bodywrap .mv-body{margin-top:0}
.mv-bodywrap.open .mv-body{border-bottom-left-radius:8px;border-bottom-right-radius:8px}
#mv-ms{position:relative;left:auto;right:auto;bottom:auto;width:auto;margin-top:0;max-height:0;padding:0 10px;border-width:0;opacity:0;transform:none;box-shadow:none;border-top-left-radius:8px;border-top-right-radius:8px;transition:max-height .45s cubic-bezier(.2,.9,.25,1),opacity .3s,padding .3s,margin .3s}
#mv-ms.on{max-height:150px;padding:10px;margin-top:4px;border-width:1px;opacity:1;transform:none}
#mv-ms .mv-msimg{width:72px;min-height:72px}
#mv-ms .mv-mst{font-size:16px}
#mv-ms .mv-msd{font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#mv-ms .mv-msw{display:none}
@media (min-width:700px){#mv-ms .mv-msimg{width:110px}#mv-ms.on{max-height:170px}}
.mv-safe{font-size:11.5px;padding:5px 6px 5px 12px;z-index:3}

/* ===== Unser Regal: community grocery finds (add-on module) ===== */
#shelf{position:absolute;inset:0;z-index:50;background:radial-gradient(120% 50% at 50% -10%,rgba(202,161,90,.14),transparent 60%),#04060b;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#shelf.on{transform:none;visibility:visible}
.sh-top{flex:none;padding:calc(var(--sat) + 10px) 16px 10px;border-bottom:1px solid var(--line2);background:rgba(4,6,11,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.sh-row{display:flex;align-items:center;gap:10px}
.sh-back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;flex:none}
.sh-back svg{width:18px;height:18px}
.sh-title{font-size:21px;font-weight:700;letter-spacing:-.01em}
.sh-seg{display:flex;gap:6px;margin-top:12px;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:16px;padding:4px}
.sh-seg button{flex:1;height:34px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);position:relative}
.sh-seg button.on{background:rgba(202,161,90,.16);color:var(--gold2)}
.sh-seg .n{display:inline-block;min-width:17px;height:17px;line-height:17px;border-radius:9px;background:var(--gold);color:#14100a;font-size:10px;font-weight:800;margin-left:4px;padding:0 4px}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(var(--sab) + 110px)}
.sh-chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin:10px -16px 0;padding-left:16px;padding-right:16px;scrollbar-width:none}
.sh-chips::-webkit-scrollbar{display:none}
.sh-chips .chip{font-size:13px;padding:6px 11px}
.sh-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sh-tile{background:var(--panel);border:1px solid var(--line2);border-radius:20px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.sh-tile .b{padding:9px 11px 11px}
.sh-tile .nm{font-size:14px;font-weight:650;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.sh-tile .pr{margin-top:6px;display:flex;align-items:baseline;gap:6px;font-size:13px}
.sh-tile .pr b{font-size:16px;color:var(--gold2)}
.sh-pack{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sh-pack img{width:100%;height:100%;object-fit:cover}
.sh-pack .em{font-size:54px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.sh-pack .lb{position:absolute;left:10px;right:10px;bottom:9px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.78);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-pack .tl{position:absolute;left:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap}

/* ===== Liquid glass (Oct 8, 2026) =====
   Translucent frosted layers over a slow holographic field. The accent comes from the star sign in Profile
   (--acc / --acc2, set by glass.js). Loaded last, so it wins over the older styles. ===== */
:root{--acc:#9fd8ff;--acc2:#d6b8ff;--acc-rgb:159,216,255;--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.1);--edge:rgba(255,255,255,.16);--edge2:rgba(255,255,255,.05);--gblur:blur(26px) saturate(185%) brightness(1.06)}
#app{background:radial-gradient(130% 70% at 50% -15%,rgba(var(--acc-rgb),.14),transparent 60%),radial-gradient(90% 60% at 100% 110%,rgba(202,161,90,.12),transparent 60%),#03050a}
/* the holographic field: three soft blobs drifting under the glass. Transforms only, so it stays cheap. */
#lsHolo{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#lsHolo i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.42;will-change:transform}
#lsHolo .b1{width:72vmax;height:72vmax;max-width:560px;max-height:560px;left:-30%;top:-18%;background:radial-gradient(circle,var(--acc),transparent 62%);animation:lsDrift1 26s ease-in-out infinite alternate}
#lsHolo .b2{width:64vmax;height:64vmax;max-width:520px;max-height:520px;right:-34%;top:30%;background:radial-gradient(circle,var(--acc2),transparent 62%);opacity:.32;animation:lsDrift2 32s ease-in-out infinite alternate}
#lsHolo .b3{width:58vmax;height:58vmax;max-width:480px;max-height:480px;left:-10%;bottom:-30%;background:radial-gradient(circle,#e6c27e,transparent 62%);opacity:.22;animation:lsDrift3 38s ease-in-out infinite alternate}
@keyframes lsDrift1{to{transform:translate3d(22%,14%,0) scale(1.12)}}
@keyframes lsDrift2{to{transform:translate3d(-26%,-12%,0) scale(.92)}}
@keyframes lsDrift3{to{transform:translate3d(18%,-16%,0) scale(1.08)}}
#main{z-index:1}

/* glass surfaces */
.card,.td-card,.cm-roomrow,.tr-post,.mv-card,.sh-store,.td-meal,.td-extra{background:linear-gradient(150deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.035) 38%,rgba(255,255,255,.02) 62%,rgba(var(--acc-rgb),.06) 100%);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),inset 0 0 22px rgba(255,255,255,.025),0 14px 34px rgba(0,0,0,.34);-webkit-backdrop-filter:var(--gblur);backdrop-filter:var(--gblur)}
.card.goldline{border-color:rgba(var(--acc-rgb),.32)}
.chip{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border-color:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.chip.on{background:linear-gradient(135deg,rgba(var(--acc-rgb),.24),rgba(202,161,90,.18));border-color:rgba(var(--acc-rgb),.55);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 18px rgba(var(--acc-rgb),.18)}
.btn.primary{position:relative;overflow:hidden;background:linear-gradient(135deg,#f4dfa6 0%,#d9b46a 45%,color-mix(in srgb,var(--acc) 55%,#d9b46a) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 6px rgba(0,0,0,.12),0 10px 30px rgba(var(--acc-rgb),.22)}
.btn.primary:after,.ls-sheen:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);animation:lsSheen 7s ease-in-out infinite;pointer-events:none}
@keyframes lsSheen{0%,70%{left:-60%}100%{left:130%}}
.btn.ghost{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.td-seg,.ls-seg{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 2px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.td-seg button.on{color:#0c0d12;background:linear-gradient(135deg,#fff3d6,#e3c27e 50%,var(--acc));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 18px rgba(var(--acc-rgb),.25)}
.input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.input:focus{border-color:rgba(var(--acc-rgb),.7);box-shadow:0 0 0 4px rgba(var(--acc-rgb),.14)}
.toggle.on{background:linear-gradient(135deg,var(--gold),var(--acc))}

/* sheet + toast: frosted, with a bright top edge */
#sheet{background:linear-gradient(180deg,rgba(28,32,44,.78),rgba(12,14,20,.9));border-top:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 -20px 60px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
#sheetwrap{background:rgba(0,0,0,.4)}
#toast{background:rgba(30,32,42,.7);border:1px solid rgba(255,255,255,.18);color:#fff;-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 30px rgba(0,0,0,.4)}

/* floating glass tab bar. Content scrolls under it, so you see the glass work. */
.tab{bottom:0;padding-bottom:calc(var(--sab) + 104px)}
#tab-shelf{bottom:calc(var(--sab) + 84px)}
#tabbar{left:10px;right:10px;bottom:calc(var(--sab) + 14px);height:68px;padding:0 4px;border-radius:34px;border:1px solid rgba(255,255,255,.17);background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04) 45%,rgba(var(--acc-rgb),.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05),0 18px 40px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(28px) saturate(190%) brightness(1.08);backdrop-filter:blur(28px) saturate(190%) brightness(1.08);overflow:visible}
#tabbar:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(var(--acc-rgb),.16) 45%,rgba(255,255,255,.12) 50%,transparent 62%);background-size:260% 100%;animation:lsBar 9s ease-in-out infinite}
@keyframes lsBar{0%{background-position:120% 0}100%{background-position:-120% 0}}
.tb{width:auto;flex:1;min-width:0;color:rgba(255,255,255,.55);position:relative;z-index:1;height:56px;justify-content:center;border-radius:28px;transition:color .2s,background .25s}
.tb.active{color:#fff;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(var(--acc-rgb),.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.tb.active svg{filter:drop-shadow(0 0 6px rgba(var(--acc-rgb),.7))}
.tb.scan{margin-top:-30px;background:none!important;box-shadow:none!important}
.tb.scan .ring{background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75),rgba(255,255,255,0) 42%),linear-gradient(140deg,#f2d99a,#c9984b 50%,var(--acc));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 26px rgba(var(--acc-rgb),.4),0 0 0 5px rgba(3,5,10,.55)}

/* holographic text + accents */
.ls-holo-t{background:linear-gradient(100deg,#f6e3b0,var(--acc) 40%,var(--acc2) 70%,#f6e3b0);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:lsTxt 8s linear infinite}
@keyframes lsTxt{to{background-position:-220% 0}}
.wordmark{color:#fff}.wordmark i{color:var(--acc)}
.tiny.gold,.gold{color:color-mix(in srgb,var(--gold2) 70%,var(--acc))}
.ls-signpill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:650;border:1px solid rgba(var(--acc-rgb),.45);background:rgba(var(--acc-rgb),.12);color:#fff}
.ls-signpill i{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 8px var(--acc)}

/* segmented pager (Community): tap or swipe */
.ls-pager{position:absolute;inset:0;display:flex;flex-direction:column}
.ls-phd{flex:none;padding:calc(var(--sat) + 14px) 18px 10px;z-index:2}
.ls-seg{position:relative;display:flex;padding:4px;border-radius:20px;margin-top:10px}
.ls-seg button{flex:1;height:44px;border-radius:16px;font-weight:650;font-size:15px;color:rgba(255,255,255,.62);position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;transition:color .2s}
.ls-seg button.on{color:#0c0d12}
.ls-seg .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 3);border-radius:16px;background:linear-gradient(135deg,#fff3d6,#e3c27e 50%,var(--acc));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 18px rgba(var(--acc-rgb),.28);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.ls-track{flex:1;display:flex;width:300%;min-height:0;transition:transform .34s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.ls-track.drag{transition:none}
.ls-pane{width:33.3333%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px calc(var(--sab) + 104px);overscroll-behavior:contain}
#tab-foryou.paged{padding:0;overflow:hidden}
.ls-post .tr-urlrow{margin-top:12px}
.ls-postfoot{display:flex;gap:10px;margin-top:16px}
.ls-postfoot .btn{flex:1}
.ls-swipehint{font-size:11.5px;color:rgba(255,255,255,.4);text-align:center;margin-top:8px;letter-spacing:.02em}

/* Fitness tab: Move lives in its own tab */
#tab-move{padding:0;overflow:hidden}
#mv-screen.tabmode{position:absolute;inset:0;transform:none;transition:none;z-index:1;background:transparent;padding-bottom:calc(var(--sab) + 104px)}
#mv-screen.tabmode .mv-back{display:none}
.td-fit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px}
.td-fit .ic{width:46px;height:46px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:22px;background:linear-gradient(140deg,rgba(var(--acc-rgb),.3),rgba(202,161,90,.2));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}

@media (prefers-reduced-motion:reduce){#lsHolo i,#tabbar:before,.btn.primary:after,.ls-sheen:after,.ls-holo-t{animation:none!important}.ls-track,.ls-seg .ind{transition:none}}

/* ===== Oct 8, 2026: centred five-item tab bar, Profile as header avatar, liquid Scan orb ===== */
#tabbar{left:max(10px,calc(50% - 250px));right:max(10px,calc(50% - 250px));padding:0 6px;justify-content:space-between}
#tabbar .tb{flex:1 1 0;width:0;min-width:0;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:10.5px;line-height:13px}
#tabbar .tb svg{width:24px;height:24px;flex:none}
#tabbar .tb .tbsp{width:24px;height:24px;flex:none;display:block}
#tabbar .tb .tbl{display:block;line-height:13px}

/* Scan: the hero. Same column as the others, so its label sits on the same line; the orb floats above it. */
#tabbar .tb.scan{margin-top:0;overflow:visible;color:rgba(255,255,255,.8)}
#tabbar .tb.scan.active{color:#fff}
#tabbar .tb.scan .orb{position:absolute;width:62px;height:62px;left:calc(50% - 31px);top:-34px;display:block;transition:transform .32s cubic-bezier(.34,1.56,.64,1),opacity .18s ease;will-change:transform,opacity}
#tabbar .tb.scan .orb.g1-away{opacity:0;transform:scale(.72);pointer-events:none}
#tabbar .tb.scan:active .orb{transform:scale(.88);transition-duration:.12s}
#tabbar .tb.scan .orb > i{position:absolute;border-radius:50%;pointer-events:none;display:block}
#tabbar .tb.scan .halo{inset:-16px;background:radial-gradient(circle,rgba(var(--acc-rgb),.6),rgba(var(--acc-rgb),.18) 45%,rgba(var(--acc-rgb),0) 68%);animation:lsHalo 2.8s ease-in-out infinite alternate}
#tabbar .tb.scan .wave{inset:0;border:1.5px solid rgba(var(--acc-rgb),.75);box-shadow:0 0 12px rgba(var(--acc-rgb),.45);opacity:0;animation:lsWave 3.2s cubic-bezier(.2,.6,.3,1) infinite}
#tabbar .tb.scan .wave.w2{animation-delay:1.6s}
#tabbar .tb.scan .splash{inset:0;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(var(--acc-rgb),.5) 45%,rgba(var(--acc-rgb),0) 70%);opacity:0;transform:scale(.6)}
#tabbar .tb.scan .orb.pop .splash{animation:lsSplash .6s ease-out}
#tabbar .tb.scan .ring{position:absolute;inset:0;width:auto;height:auto;margin:0;border-radius:50%;overflow:hidden;isolation:isolate;-webkit-clip-path:circle(50% at 50% 50%);clip-path:circle(50% at 50% 50%);-webkit-mask-image:-webkit-radial-gradient(white,black);mask-image:radial-gradient(circle,#000 70%,#000 100%);display:flex;align-items:center;justify-content:center;color:#0c1117;
  background:radial-gradient(circle at 50% 70%,rgba(var(--acc-rgb),.95),rgba(var(--acc-rgb),.55) 55%,rgba(10,20,30,.9) 100%),linear-gradient(150deg,#f2d99a,var(--acc) 55%,var(--acc2));
  box-shadow:inset 0 2px 5px rgba(255,255,255,.75),inset 0 -10px 18px rgba(0,0,0,.28),0 10px 28px rgba(var(--acc-rgb),.55),0 0 0 4px rgba(3,5,10,.5);animation:lsJelly 3.4s ease-in-out infinite;will-change:transform}
#tabbar .tb.scan.active .ring{box-shadow:inset 0 2px 5px rgba(255,255,255,.8),inset 0 -10px 18px rgba(0,0,0,.25),0 10px 34px rgba(var(--acc-rgb),.8),0 0 0 4px rgba(3,5,10,.5),0 0 0 6px rgba(var(--acc-rgb),.35)}
#tabbar .tb.scan .liq{position:absolute;inset:0;border-radius:50%;-webkit-clip-path:circle(50% at 50% 50%);clip-path:circle(50% at 50% 50%);pointer-events:none;
  background:radial-gradient(circle at 32% 34%,rgba(255,255,255,.65) 0,rgba(255,255,255,0) 20%),radial-gradient(circle at 68% 62%,var(--acc2) 0,rgba(0,0,0,0) 26%),radial-gradient(circle at 60% 26%,#f6dfa4 0,rgba(0,0,0,0) 22%),radial-gradient(circle at 28% 72%,rgba(var(--acc-rgb),1) 0,rgba(0,0,0,0) 28%);
  animation:lsSwirl 7s linear infinite;will-change:transform}
#tabbar .tb.scan .liq.l2{opacity:.75;mix-blend-mode:screen;animation:lsSwirl2 11s linear infinite;
  background:radial-gradient(ellipse 30% 18% at 40% 60%,rgba(255,255,255,.55),rgba(255,255,255,0) 100%),radial-gradient(ellipse 22% 30% at 66% 38%,rgba(var(--acc-rgb),.9),rgba(0,0,0,0) 100%),radial-gradient(ellipse 26% 16% at 30% 30%,var(--acc2),rgba(0,0,0,0) 100%)}
#tabbar .tb.scan .gloss{position:absolute;left:14%;top:7%;width:52%;height:30%;border-radius:50%;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0));filter:none;z-index:2}
#tabbar .tb.scan .ring svg{position:relative;z-index:3;width:28px;height:28px;filter:drop-shadow(0 1px 1px rgba(255,255,255,.45))}
@keyframes lsJelly{0%,100%{transform:scale(1,1)}22%{transform:scale(1.04,.965)}44%{transform:scale(.97,1.035)}66%{transform:scale(1.02,.985)}82%{transform:scale(.99,1.012)}}
@keyframes lsSwirl{to{transform:rotate(360deg)}}
@keyframes lsSwirl2{0%{transform:rotate(0) scale(1)}50%{transform:rotate(-180deg) scale(1.12)}100%{transform:rotate(-360deg) scale(1)}}
@keyframes lsHalo{0%{opacity:.55;transform:scale(.92)}100%{opacity:1;transform:scale(1.08)}}
@keyframes lsWave{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}
@keyframes lsSplash{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.1)}}

/* Profile: a round avatar at the top right of every screen */
#pfBtn{position:absolute;top:calc(var(--sat) + 12px);right:16px;z-index:12;flex:none;width:42px;height:42px;min-width:0;padding:0;margin:0;display:block;border-radius:50%;overflow:hidden;color:#fff;
  border:1px solid rgba(255,255,255,.28);background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.05));-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.4);transition:transform .2s,box-shadow .2s}
#pfBtn:active{transform:scale(.92)}
#pfBtn.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 2px rgba(var(--acc-rgb),.85),0 0 16px rgba(var(--acc-rgb),.55)}
#pfBtn .av{width:100%!important;height:100%!important;border:0;margin:0;font-size:16px!important}
#main.pf-hide #pfBtn{opacity:0;pointer-events:none}

/* Header lines keep clear of the avatar */
#tab-scan > .h1:first-child,#tab-scan > .h1:first-child + .small,#shelf.tabmode .sh-top > .h1,#shelf.tabmode .sh-top > .small,#mv-screen.tabmode > .stack:first-child > *{padding-right:54px}

/* Today: the wordmark moves left, small, above the greeting; the avatar has room on the right */
.td-top{padding-right:54px}
.td-wm{font-size:10px;letter-spacing:.3em;opacity:.75;padding-bottom:0;margin-bottom:6px}

@media (prefers-reduced-motion:reduce){#tabbar .tb.scan .halo,#tabbar .tb.scan .ring,#tabbar .tb.scan .liq,#tabbar .tb.scan .orb.pop .splash{animation:none!important}#tabbar .tb.scan .wave{display:none}#tabbar .tb.scan .orb{transition:none}}

/* ===== Oct 8, 2026: one app, every screen. Phone, iPad (portrait + landscape) and laptop, picked automatically.
   data-lay on <html> comes from responsive.js. Phone = everything above, unchanged. Loaded last, so it wins. ===== */
.rs-sec{display:contents}
.rs-brand{display:none}
/* the Community pager is 3 panes wide by design (For You | Channels | Post); clip it so the parked panes can never be scrolled into view */
.ls-pager{overflow:hidden;overflow:clip}

/* ---------- shared by iPad and laptop ---------- */
html:not([data-lay=phone]){--side:0px;--maxw:980px;--gutmin:28px}
html:not([data-lay=phone]) #app{max-width:none}
/* every scrolling column centres its content in a comfortable width */
html:not([data-lay=phone]) .tab,
html:not([data-lay=phone]) .ls-phd,
html:not([data-lay=phone]) .ls-pane,
html:not([data-lay=phone]) #shelf.tabmode .sh-top,
html:not([data-lay=phone]) #shelf.tabmode .sh-body,
html:not([data-lay=phone]) #mv-screen.tabmode{padding-left:max(var(--gutmin),calc((100vw - var(--side) - var(--maxw)) / 2));padding-right:max(var(--gutmin),calc((100vw - var(--side) - var(--maxw)) / 2))}
html:not([data-lay=phone]) #tab-foryou.paged,html:not([data-lay=phone]) #tab-foryou.cm-splitmode{padding:0}
html:not([data-lay=phone]) .ls-pane{--maxw:720px}
html:not([data-lay=phone]) .ls-phd{--maxw:720px}
html:not([data-lay=phone]) #tab-scan{--maxw:680px}
html:not([data-lay=phone]) #tab-profile{--maxw:720px}
html:not([data-lay=phone]) #shelf.tabmode .sh-body:not(:has(> .sh-rec)){--maxw:780px}
html:not([data-lay=phone]) #shelf.tabmode .sh-top{--maxw:980px}
html:not([data-lay=phone]) #pfBtn{right:max(18px,calc((100vw - var(--side) - var(--maxw)) / 2 - 56px))}

/* Today: the steps sit side by side, two columns */

html:not([data-lay=phone]) button:focus-visible,html:not([data-lay=phone]) a:focus-visible,html:not([data-lay=phone]) .input:focus-visible{outline:2px solid rgba(var(--acc-rgb),.9);outline-offset:2px}

/* ===== Oct 8 fix round: For You as a TikTok-style feed, ONE community chat. Loaded last so it wins. ===== */

#cmPaneFeed.fy-pane,html:not([data-lay=phone]) #cmPaneFeed.fy-pane{padding:0;overflow:hidden}

html:not([data-lay=phone]) .fy-slide{width:min(520px,100%);margin:0 auto}

/* ===== Round 5 (Oct 8, 2026): food shuffle, food swipe, audio mode, profiles, Move kit list ===== */
/* --- Move: what you have, one grouped list --- */

/* --- audio mode row in Move --- */

/* --- Cook: the food shuffle --- */
.r5-shuf{display:flex;flex-direction:column;align-items:center;padding:6px 0 0}
.r5-stage{position:relative;width:min(72vw,300px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;cursor:pointer;isolation:isolate;-webkit-tap-highlight-color:transparent}
.r5-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--acc,#ffd36e),#7ef0ff,#c49bff,#ff8fd0,var(--acc,#ffd36e));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:r5spin 9s linear infinite;opacity:.85;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--acc,#ffd36e) 60%,transparent))}
.r5-ring.r2{inset:-12px;opacity:.3;animation-duration:14s;animation-direction:reverse;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 1.5px),#000 calc(100% - 1px));mask:radial-gradient(farthest-side,transparent calc(100% - 1.5px),#000 calc(100% - 1px))}
.r5-grid{position:absolute;inset:8px;border-radius:50%;background:repeating-linear-gradient(0deg,rgba(126,240,255,.07) 0 1px,transparent 1px 14px),repeating-linear-gradient(90deg,rgba(126,240,255,.07) 0 1px,transparent 1px 14px);z-index:-1}
.r5-win{position:absolute;inset:10px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.12),rgba(10,12,20,.8));box-shadow:inset 0 0 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.3)}
.r5-strip{display:flex;flex-direction:column;width:100%;will-change:transform}
.r5-cell{width:100%;aspect-ratio:1;flex:0 0 auto;display:grid;place-items:center;font-size:64px}
.r5-cell img{width:100%;height:100%;object-fit:cover}
.r5-idle .r5-q{font-size:92px;font-weight:800;background:linear-gradient(135deg,#fff,var(--acc,#ffd36e),#7ef0ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:r5pulse 2.4s ease-in-out infinite}
.r5-scan{position:absolute;inset:10px;border-radius:50%;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,transparent 40%,rgba(126,240,255,.28) 50%,transparent 60%);background-size:100% 220%;opacity:0}
.r5-flash{position:absolute;inset:-6px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 0 color-mix(in srgb,var(--acc,#ffd36e) 70%,transparent);opacity:0}

    (p.ok ? '<div class="fst-badge">âœ“ ' + esc(w("badge")) + '</div>' : '<div class="fst-part">' + esc(w("partial")) + '</div>') +
    '<div class="fst-xp">+<b id="fstXp" data-x="' + p.x + '">' + (RM ? p.x : 0) + '</b> XP</div>' +
    '<div class="fst-brk">' + esc(w("perH", {h:p.full})) + ' <b>+' + p.base + '</b>' + (p.msx ? '<br>' + esc(w("ms")) + ' (' + p.ms.length + ') <b>+' + p.msx + '</b>' : "") + (p.ok ? '<br>' + esc(w("gb")) + ' <b>+' + GOAL_X + '</b>' : "") + '</div>' +
    '<button class="btn primary fst-ok-b" data-fst="rw-close">' + esc(CH ? w("chain") : w("enjoy")) + '</button><p class="tiny muted fst-next">' + esc(w("next")) + '</p></div>';
  document.body.appendChild(d);
  requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add("on")));
  setTimeout(() => sfx(p.ok ? "workoutDone" : "levelup"), 250);
  try { navigator.vibrate && navigator.vibrate(p.ok ? [30, 60, 30, 60, 80] : [30, 50, 40]); } catch(e){}
  if (!RM) { const el = d.querySelector("#fstXp"), n = p.x, t0 = performance.now(), D = 900;
    const step = now => { const k = Math.min(1, (now - t0) / D); el.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    setTimeout(() => requestAnimationFrame(step), 300); } }
let CH = null; /* F2: after the reward the app carries on to "What did you eat?" */
function closeRw(){ const d = document.getElementById("fstRw"); if (!d) return; d.classList.remove("on"); setTimeout(() => d.remove(), 300);
  if (CH && window.LowiF2) { const c = CH; CH = null; setTimeout(() => LowiF2.start(c), 320); } }

/* ---------- clicks ---------- */
document.addEventListener("click", e => {
  const rw = e.target.closest("#fstRw"); if (rw && (e.target === rw || e.target.closest('[data-fst="rw-close"]'))) { e.preventDefault(); closeRw(); sfx("close"); return; }
  const a = e.target.closest("[data-fst]"); if (!a) return; const k = a.dataset.fst;
  if (k === "open") { e.preventDefault(); e.stopPropagation(); open(); }
  else if (k === "pick") { SEL = +a.dataset.t || 0; paint(); sfx("tap"); }
  else if (k === "clock") { const i = document.getElementById("fstIn"); if (i && e.target !== i) { try { if (i.showPicker) { i.showPicker(); e.preventDefault(); } } catch(x){} } }
  else if (k === "end") { const r = end(SEL || Date.now(), {chain:true}); if (r && r.err) { try { toast(w("before")); } catch(x){} } }
}, true);
function fromInput(i){ const t = new Date(i.value).getTime(); if (!t) return; const start = startOf(); SEL = Math.min(Date.now(), Math.max(start + 60000, t)); if (Date.now() - SEL < 30000) SEL = 0; paint(); }
document.addEventListener("change", e => { if (e.target && e.target.id === "fstIn") fromInput(e.target); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("fstRw")) closeRw(); });
// keep the live numbers in the sheet fresh
setInterval(() => { if (!document.hidden && document.getElementById("fstSheet") && !SEL && document.activeElement && document.activeElement.id !== "fstIn") paint(); }, 30000);

/* ---------- pieces other parts drop in ---------- */
const stopPill = () => '<button type="button" class="fst-stop" data-fst="open" aria-label="' + esc(w("stopAria")) + '"><i aria-hidden="true"></i>' + esc(w("stop")) + '</button>';
const bigBtn = cls => '<button type="button" class="btn primary fst-btn' + (cls ? " " + cls : "") + '" data-fst="open" data-noi18n>' + esc(w("btnNow")) + '</button>';
const LV = {en:"Level {n} \u00b7 you're a {t} now", de:"Level {n} \u00b7 du bist jetzt {t}", es:"Nivel {n} \u00b7 ahora eres {t}"};
const lvl = (n, t) => LV[lang()].replace("{n}", n).replace("{t}", t);
window.LowiFastStop = {lvl, open, end, mealTicked, points, startOf, stopPill, bigBtn, histHTML, reward, _st:st, w};
})();
</script>
