<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>LOWiSPIKE · list</title>
<!-- 24 Nov 2026 (Emmanuel: "when I share it, she gets this really nice interface that opens really fast, that shows that it's insulin
     safe, and then has the picture in there, so she can even show it to the workers"). A shared Grocery Run list, kitchen or menu
     (grocery-run.js shareLink). The whole list rides in the link after #, so this page needs no server, no sign-in and no data
     file: it draws at once. Photos come from Open Food Facts (the product's front photo); prices are estimates and say so. -->
<style>
:root{color-scheme:dark;--g:#3dffa0;--b:#46d7ff;--r:#ff4d7a;--y:#ffd84a;--ink:#eef3ff;--mut:rgba(226,234,255,.62)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(90% 50% at 50% -10%,rgba(120,90,255,.3),rgba(0,0,0,0) 60%),#05060c;color:var(--ink);font:600 16px/1.35 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 30px)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}.top img{width:44px;height:44px;border-radius:12px}
.top b{display:block;font-size:13px;letter-spacing:.14em;color:var(--mut)}.top h1{margin:0;font-size:26px;line-height:1.1;text-shadow:0 0 18px rgba(185,139,255,.6)}
.sub{margin:4px 0 14px;color:var(--mut);font-size:14.5px}
h2{margin:22px 2px 10px;font-size:17px;color:#fff}
.it{display:flex;gap:14px;align-items:center;margin:0 0 12px;padding:12px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.4)}
.ph{flex:none;width:112px;height:112px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;font-size:44px}.ph img{width:100%;height:100%;object-fit:contain}
.tx{min-width:0;flex:1}.tx b{display:block;font-size:18px;line-height:1.25}.q{color:var(--mut);font-size:14px;margin-top:2px}
.tag{display:inline-block;margin-top:8px;padding:5px 10px;border-radius:10px;font-size:13.5px;font-weight:800}
.t0{background:rgba(61,255,160,.14);color:var(--g);box-shadow:inset 0 0 0 1px rgba(61,255,160,.5),0 0 14px rgba(61,255,160,.25)}
.t1{background:rgba(70,215,255,.14);color:var(--b);box-shadow:inset 0 0 0 1px rgba(70,215,255,.5)}
.t2{background:rgba(255,77,122,.14);color:var(--r);box-shadow:inset 0 0 0 1px rgba(255,77,122,.5)}
.pr{display:block;margin-top:6px;font-size:17px;color:#fff}
.note{margin:18px 4px 0;color:var(--mut);font-size:12.5px;text-align:center}
.get{display:block;margin:18px auto 0;width:100%;max-width:360px;padding:16px;border-radius:18px;text-align:center;text-decoration:none;color:#160f00;font-weight:900;font-size:18px;background:linear-gradient(180deg,#ffe680,var(--y));box-shadow:0 0 22px rgba(255,216,74,.5)}
.err{margin-top:30vh;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<main id="m"></main>
<script>
(function () {
  'use strict';
  var IMG = 'https://images.openfoodfacts.org/images/products/';
  var W = {
    en: { list: 'Shopping list', find: 'Insulin-friendly picks', kitchen: 'My kitchen', menu: 'Today’s menu', cart: 'My grocery cart', by: 'Made with LOWiSPIKE', tags: ['✓ Insulin-friendly · best', '✓ Insulin-friendly', '⚠ Spikes blood sugar'], est: 'Prices are estimates (≈), not the shop’s real prices. Food guidance, not medical advice.', get: 'Get LOWiSPIKE, free', bad: 'This link is broken or cut off. Ask for it again.', at: 'at' },
    de: { list: 'Einkaufsliste', find: 'Insulinfreundliche Auswahl', kitchen: 'Meine Küche', menu: 'Heutiges Menü', cart: 'Mein Einkaufswagen', by: 'Gemacht mit LOWiSPIKE', tags: ['✓ Insulinfreundlich · Top', '✓ Insulinfreundlich', '⚠ Lässt den Blutzucker steigen'], est: 'Preise sind Schätzungen (≈), nicht die echten Preise im Laden. Ernährungstipps, keine medizinische Beratung.', get: 'LOWiSPIKE holen, kostenlos', bad: 'Dieser Link ist kaputt oder abgeschnitten. Lass ihn dir nochmal schicken.', at: 'bei' },
    es: { list: 'Lista de la compra', find: 'Opciones aptas para la insulina', kitchen: 'Mi cocina', menu: 'Menú de hoy', cart: 'Mi carrito', by: 'Hecho con LOWiSPIKE', tags: ['✓ Apto para la insulina · top', '✓ Apto para la insulina', '⚠ Sube el azúcar'], est: 'Los precios son estimaciones (≈), no los reales de la tienda. Guía de alimentación, no consejo médico.', get: 'Consigue LOWiSPIKE gratis', bad: 'Este enlace está roto o cortado. Pídelo otra vez.', at: 'en' }
  };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function dec(h) { var b = atob(h.replace(/-/g, '+').replace(/_/g, '/')), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return JSON.parse(new TextDecoder().decode(u)); }
  var m = document.getElementById('m'), d = null;
  try { d = dec(location.hash.slice(1)); } catch (e) { d = null; }
  var L = W[(d && d.l) || (navigator.language || 'en').slice(0, 2)] || W.en;
  if (!d || !Array.isArray(d.g)) { m.innerHTML = '<p class="err">' + esc(L.bad) + '</p>'; return; }
  document.documentElement.lang = d.l || 'en';
  var title = { list: L.list, find: L.find, kitchen: L.kitchen, menu: L.menu, cart: L.cart }[d.k] || L.list;
  document.title = 'LOWiSPIKE · ' + title;
  var eur = function (c) { return '€' + (c / 100).toFixed(2).replace('.', d.l === 'en' ? '.' : ','); };
  var safe = function (p) { return /^[0-9/]+\/(?:front|image)[A-Za-z0-9_.-]*\.(?:200|400)\.jpg$/.test(p) ? IMG + p.replace(/\.200\.jpg$/, '.400.jpg') : ''; };
  m.innerHTML = '<div class="top"><img src="../icon-192.png" alt=""><div><b>LOWiSPIKE</b><h1>' + esc(title) + '</h1></div></div>' +
    '<p class="sub">' + esc(L.by) + (d.s && d.k !== 'menu' && d.k !== 'kitchen' ? ' · ' + esc(L.at) + ' ' + esc(d.s) : '') + '</p>' +
    d.g.map(function (g) {
      return '<h2>' + esc(g[0]) + '</h2>' + (g[1] || []).map(function (it) {
        var src = safe(String(it[1] || '')), tag = Math.max(0, Math.min(2, +it[2] || 0));
        return '<div class="it"><div class="ph">' + (src ? '<img alt="" src="' + esc(src) + '">' : '🛒') + '</div><div class="tx"><b>' + (it[4] > 1 ? it[4] + '× ' : '') + esc(it[0]) + '</b>' +
          '<span class="tag t' + tag + '">' + esc(L.tags[tag]) + '</span>' + (it[3] > 0 ? '<span class="pr">≈ ' + esc(eur(it[3])) + '</span>' : '') + '</div></div>';
      }).join('');
    }).join('') +
    '<p class="note">' + esc(L.est) + '</p><a class="get" href="../">' + esc(L.get) + '</a>';
})();
</script>
</body>
</html>
