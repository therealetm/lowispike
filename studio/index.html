<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050912">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Studio · LOWiSPIKE</title>
<meta name="description" content="Videos, die funktionieren. Tippe eins an und bau es für dich nach.">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
/* LOWiSPIKE Studio (21 Nov 2026). Looks like Instagram's Explore grid (Emmanuel's screenshots): search on top, topic chips, an
   edge-to-edge grid of video covers with the view count on each. A tap opens it like an Instagram post: the video on top, and
   where the caption would be, OUR guide for the person and their agent. Content lives ONLY in cards.json (also read by agents).
   Nothing here generates, posts or schedules anything. App blue, no gold. */
:root{--ink:#eef3fb;--muted:#a9b6cb;--dim:#7f8ca3;--acc:#7cc4ff;--acc2:#bfe6ff;--line:rgba(159,216,255,.24);--line2:rgba(255,255,255,.09);--ok:#8fe6c8;--warn:#f0c48a;--panel:#0c1322}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{overflow-x:hidden;background:#050912}
body{min-height:100vh;min-height:100dvh;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden;
  background:radial-gradient(120% 50% at 50% -8%,#112a5c 0%,#0a1736 38%,#060a15 72%,#050912 100%) fixed,#050912}
.wrap{width:min(720px,100%);margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 0}
.back{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line2);text-decoration:none;font-size:24px;line-height:1}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid var(--line2)}
.search svg{flex:none;width:20px;height:20px;color:var(--muted)}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:0}
.search input::placeholder{color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 10px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#050912;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin:0 -16px}
.tile{position:relative;display:block;aspect-ratio:3/4;padding:0;border:0;border-radius:0;background:#0c1426;color:#fff;font:inherit;text-align:left;cursor:pointer;overflow:hidden}
.tile:active{opacity:.85}
.cv{position:absolute;inset:0;background-size:cover;background-position:center}
.cv.nf{display:flex;align-items:center;justify-content:center;padding:40px 8px 34px}
.cv.nf q{font-size:12.5px;font-weight:700;line-height:1.28;text-align:center;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;quotes:none;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.6));pointer-events:none}
.tile .vw{position:absolute;left:8px;bottom:7px;z-index:2;display:flex;align-items:center;gap:5px;font-size:16px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.tile .vw svg{width:20px;height:20px}
.tile .pid{position:absolute;left:8px;top:8px;z-index:2;font-size:11px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:7px;background:rgba(5,9,18,.62)}
.tile .pl{position:absolute;right:7px;top:7px;z-index:2;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:999px;background:rgba(5,9,18,.62)}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}
/* the post */
.post{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;background:#000}
.post.on{display:flex}
.stage{position:relative;flex:none;height:46dvh;min-height:250px;display:flex;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top)) 56px 14px}
.stage .x{position:absolute;left:12px;top:calc(10px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:24px;line-height:1;cursor:pointer;z-index:2}
.vid{position:relative;display:block;height:100%;aspect-ratio:9/15;max-width:100%;border-radius:18px;overflow:hidden;background:#0c1426;color:#fff;text-decoration:none;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.vid .cv.nf{padding:50px 16px 24px}
.vid .cv.nf q{font-size:17px;-webkit-line-clamp:9}
.vid .play{position:absolute;top:50%;left:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:20px;padding-left:4px}
.vid .pl{position:absolute;left:10px;top:10px;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(5,9,18,.66)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-radius:26px 26px 0 0;border-top:1px solid var(--line2)}
.grab{flex:none;width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);margin:9px auto 0}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px 18px 16px}
.who{display:flex;align-items:center;gap:12px}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#050912;background:linear-gradient(180deg,var(--acc2),var(--acc))}
.who .nm{flex:1;min-width:0}
.who b{display:block;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.who small{display:block;color:var(--muted);font-size:13.5px;line-height:1.3}
.fol{flex:none;min-height:40px;padding:0 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,.55);color:#fff;background:transparent;font:inherit;font-size:15px;font-weight:700;text-decoration:none;display:flex;align-items:center}
.cap{margin:16px 0 0;font-size:17px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
.cap.why{margin-top:10px;font-size:15px;color:var(--muted)}
.chk{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.chk li{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.chk li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:7px;background:#1f9d62;color:#fff;font-size:15px;font-weight:800;display:grid;place-items:center;margin-top:1px}
h3.sec{margin:22px 0 10px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--acc2)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;min-height:62px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--line2);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;cursor:pointer}
.opt[aria-pressed=true]{border-color:var(--acc);background:rgba(124,196,255,.12)}
.opt .ic{flex:none;font-size:24px}
.opt b{display:block;font-size:16px}.opt small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.lv[hidden],.nt[hidden]{display:none}
.lv button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(159,216,255,.06);color:var(--acc2);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px}
.lv button[aria-pressed=true]{background:var(--acc2);color:#050912}
.nt{margin:8px 2px 0;color:var(--dim);font-size:13px;line-height:1.35}
.fld{margin-top:14px}
.fld label{display:block;margin-bottom:4px;color:var(--muted);font-size:13px}
.fld input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
.fld input::placeholder{color:var(--dim)}
.sm{margin:16px 0 0;color:var(--dim);font-size:12.5px;line-height:1.4}
.sm b{color:var(--warn);font-weight:600}
details.more{margin-top:14px;border-top:1px solid var(--line2);padding-top:6px}
details.more summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--acc2);font-weight:650;font-size:15px}
.f{margin-top:12px}
.f h4{margin:0 0 4px;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--acc2)}
.f .t{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.f.copy .t{padding:12px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--line2)}
.cp2{margin-top:8px;min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:rgba(159,216,255,.1);color:var(--acc2);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.links a{display:block;color:var(--acc2);font-size:14px;overflow-wrap:anywhere;padding:6px 0}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);background:var(--panel)}
.bar input{flex:1;min-width:0;height:48px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:16px;padding:0 16px}
.bar input::placeholder{color:var(--dim)}
.go{flex:none;min-height:48px;padding:0 18px;border-radius:999px;border:0;background:linear-gradient(180deg,var(--acc2),var(--acc));color:#050912;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.go.ok{background:linear-gradient(180deg,#c9f5e6,var(--ok))}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;max-width:calc(100% - 32px);padding:12px 16px;border-radius:14px;background:rgba(14,22,40,.97);border:1px solid var(--line);font-size:15px;display:none}
.toast.on{display:block}
.fb{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:rgba(0,0,0,.6)}
.fb.on{display:flex}
.fb .in{width:100%;max-height:80dvh;display:flex;flex-direction:column;gap:10px;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:#0a1224;border-top:1px solid var(--line);border-radius:20px 20px 0 0}
.fb textarea{flex:1;min-height:200px;width:100%;border-radius:12px;border:1px solid var(--line2);background:#050912;color:var(--ink);font:inherit;font-size:16px;padding:10px}
.fb button{min-height:44px;border-radius:14px;border:0;background:var(--acc2);color:#050912;font:inherit;font-weight:700}
.note{color:var(--muted);font-size:14px}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
@media (min-width:700px){.grid{margin:0}.tile{border-radius:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" id="back" href="../" aria-label="Zurück zu LOWiSPIKE">‹</a>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg><input id="q" type="search" placeholder="Studio durchsuchen" aria-label="Studio durchsuchen" autocomplete="off"></label>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Themen">
    <button class="chip" data-t="swipe" data-e="" aria-pressed="true">Für dich</button>
    <button class="chip" data-t="swipe" data-e="E1" aria-pressed="false">Gesichtslos</button>
    <button class="chip" data-t="swipe" data-e="E2" aria-pressed="false">Mit Stimme</button>
    <button class="chip" data-t="swipe" data-e="E3" aria-pressed="false">Hände</button>
    <button class="chip" data-t="swipe" data-e="E4" aria-pressed="false">Gesicht</button>
    <button class="chip" data-t="make" data-e="" aria-pressed="false">Bausteine</button>
    <button class="chip" data-t="start" data-e="" aria-pressed="false">Start</button>
  </div>
  <main id="main"><div class="empty">Lädt…</div></main>
</div>
<section class="post" id="post" role="dialog" aria-modal="true" aria-label="Video"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="fb" id="fb" role="dialog" aria-modal="true" aria-label="Text zum Kopieren"><div class="in"><b>Kopieren hat nicht geklappt</b><span class="note">Der Text ist unten markiert. Halte darauf gedrückt und tippe auf „Kopieren“.</span><textarea id="fbt" readonly></textarea><button id="fbx">Fertig</button></div></div>
<script>
(function () {
  'use strict';
  var D = document, DATA = null, TAB = 'swipe', EFF = '', Q = '', OPEN = null;
  var PK = 'lowi.studio.me.v1', ME = {niche: '', voice: '', level: 'E1', way: 'self'};
  var $ = function (s) { return D.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var LV = {E1: 'gesichtslos (Text auf dem Bild, B-Roll, Bildschirmaufnahme, KI-Bilder)', E2: 'mit Stimme, eigene oder KI-Stimme, kein Gesicht', E3: 'Hände und Dinge im Bild, kein Gesicht', E4: 'mit Gesicht, ich rede selbst in die Kamera'};
  var LVN = {E1: 'Gesichtslos', E2: 'Stimme', E3: 'Hände', E4: 'Gesicht'};
  try { var s0 = JSON.parse(localStorage.getItem(PK) || 'null'); if (s0 && typeof s0 === 'object') ME = {niche: String(s0.niche || ''), voice: String(s0.voice || ''), level: LV[s0.level] ? s0.level : 'E1', way: /^(self|hf|avatar)$/.test(s0.way) ? s0.way : 'self'}; } catch (e) {}
  function saveMe() { try { localStorage.setItem(PK, JSON.stringify(ME)); } catch (e) {} }

  /* honest copy: success only when the browser confirms it */

  function saveThumb() { try { localStorage.setItem(TK, JSON.stringify(THUMB)); } catch (e) {} }
  function videoLink(c) { for (var i = 0; i < c.links.length; i++) { var u = c.links[i]; if (/youtu\.?be/i.test(u)) continue; if (/vm\.tiktok\.com|tiktok\.com\/.+\/video\/|instagram\.com\/(reel|p)\//i.test(u)) return u; } return ''; }
  function platform(u) { return /instagram/i.test(u) ? 'Instagram' : /tiktok/i.test(u) ? 'TikTok' : ''; }
  function thumbOf(c) { var u = videoLink(c), t = u && THUMB[u]; return t && t.thumb ? t.thumb : ''; }
  function stats(c) { var z = field(c, /^Zahlen/), o = {}; z.replace(/([\d.,]+\s?[KM]?)\s*(Views|Saves|Shares)/gi, function (m, n, k) { o[k.toLowerCase()] = n.replace(/\s/g, ''); return m; }); return o; }
  function hue(id) { var n = 0; for (var i = 0; i < id.length; i++) n = (n * 31 + id.charCodeAt(i)) % 360; return n; }
  function gradient(c) { return 'linear-gradient(160deg,hsl(' + hue(c.id) + ' 46% 24%),hsl(' + ((hue(c.id) + 40) % 360) + ' 50% 12%))'; }
  function cover(c, hook) { var th = thumbOf(c); return '<div class="cv' + (th ? '' : ' nf') + '" style="background-image:' + (th ? 'url(&quot;' + esc(th) + '&quot;)' : gradient(c)) + '">' + (th ? '' : '<q>' + esc(hook) + '</q>') + '</div>'; }
  function pump() {
    if (busy || fails >= 3 || !queue.length) return; var c = queue.shift(), u = videoLink(c); if (!u || THUMB[u]) return pump(); busy = true;
    var ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 15000);
    fetch(FN, {method: 'POST', signal: ctl.signal, headers: {'Content-Type': 'application/json', apikey: PUBKEY, Authorization: 'Bearer ' + PUBKEY}, body: JSON.stringify({url: u})})
      .then(function (r) { return r.json(); }).then(function (j) {
        var th = j && j.ok && j.meta && j.meta.thumb ? j.meta.thumb : ''; THUMB[u] = {thumb: th, t: Date.now()}; if (th) fails = 0; else fails++; saveThumb();
        if (th) D.querySelectorAll('.tile[data-id="' + c.id + '"] .cv, #post[data-id="' + c.id + '"] .cv').forEach(function (el) { el.classList.remove('nf'); el.style.backgroundImage = 'url("' + th + '")'; var q = el.querySelector('q'); if (q) q.remove(); });
        var vv = D.querySelector('#post[data-id="' + c.id + '"] a.vid'); if (th && vv && !vv.querySelector('.play')) vv.insertAdjacentHTML('beforeend', '<span class="play" aria-hidden="true">▶</span>');
      }).catch(function () { fails++; }).then(function () { clearTimeout(to); busy = false; pump(); });
  }
  function want(c) { var u = videoLink(c); if (!u) return; var t = THUMB[u]; if (t && (t.thumb || Date.now() - t.t < 6 * 3600e3)) return; queue.push(c); pump(); }
  var IO = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { IO.unobserve(e.target); var c = byId(e.target.dataset.id); if (c) want(c); } }); }, {rootMargin: '300px'}) : null;

  var EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  function tileHTML(c) {
    var st = stats(c), isV = c.area === 'swipe', hook = isV ? hookOf(c).replace(/^„|“$/g, '') : c.title, pl = platform(videoLink(c));
    return '<button class="tile" data-id="' + esc(c.id) + '" aria-label="' + esc(c.title) + '">' + cover(c, hook) + (isV ? '' : '<span class="pid">' + esc(c.id) + '</span>') + (pl ? '<span class="pl">' + esc(pl) + '</span>' : '') +
      (st.views ? '<span class="vw">' + EYE + esc(st.views) + '</span>' : '') + '</button>';
  }
  function render() {
    var cards = DATA.cards.filter(function (c) { return (Q ? true : c.area === TAB) && (Q ? true : effOk(c)) && (!Q || haystack(c).indexOf(Q) >= 0); });
    $('#main').innerHTML = cards.length ? '<div class="grid">' + cards.map(tileHTML).join('') + '</div>' : '<div class="empty">' + (Q ? 'Nichts gefunden. Versuch ein anderes Wort.' : 'Dafür gibt es hier noch nichts.') + '</div>';
    if (IO) D.querySelectorAll('.tile').forEach(function (t) { IO.observe(t); });
  }
  function setTab(t, e) { TAB = t; EFF = e || ''; D.querySelectorAll('#chips .chip').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.t === TAB && (b.dataset.e || '') === EFF ? 'true' : 'false'); }); render(); window.scrollTo(0, 0); }

  /* ---- the post: video on top, our guide where the caption would be */
  function who(c) { var t = c.title, m = t.match(/^(.*?)\s*\((@[^)]+)\)/); if (m) return {name: m[1], handle: m[2]}; if (c.area === 'swipe') return {name: t.split(':')[0], handle: ''}; return {name: 'Studio', handle: ''}; }
  function stepsOf(c) {
    if (c.area === 'swipe') { var fl = field(c, /^Ablauf/); return fl ? fl.split('→').map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 6) : []; }
    var ag = field(c, /^Agent-Ansicht/); return ag ? ag.split('\n').map(function (x) { return x.replace(/^\s*\d+\.\s*/, '').trim(); }).filter(Boolean).slice(0, 6) : [];
  }
  function openCard(id, fromHash) {
    var c = byId(id); if (!c) return; OPEN = c;
    var isV = c.area === 'swipe', hook = hookOf(c).replace(/^„|“$/g, ''), w = who(c), st = stats(c), vl = videoLink(c), steps = stepsOf(c), why = field(c, /^Warum es wirkt/);
    var nums = [st.views && st.views + ' Aufrufe', st.saves && st.saves + ' gespeichert', st.shares && st.shares + ' geteilt'].filter(Boolean).join(' · ');
    var more = c.fields.map(function (f, i) {
      var cp = /^(Kopier das|Remix-Prompt|Agent-Ansicht)/.test(f.label);
      return '<div class="f' + (cp ? ' copy' : '') + '"><h4>' + esc(f.label) + '</h4><div class="t">' + esc(f.text) + '</div>' + (cp ? '<button class="cp2" data-i="' + i + '">Nur diesen Text kopieren</button>' : '') + '</div>';
    }).join('');
    var links = c.links.length ? '<div class="f links"><h4>Links (öffnen die Originalplattform)</h4>' + c.links.map(function (u) { return '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(u) + '</a>'; }).join('') + '</div>' : '';
    var pl = platform(vl);
    var vid = '<' + (vl ? 'a href="' + esc(vl) + '" target="_blank" rel="noopener noreferrer" aria-label="Original ansehen"' : 'div') + ' class="vid">' + cover(c, hook) + (pl ? '<span class="pl">' + esc(pl) + '</span>' : '') + (vl && thumbOf(c) ? '<span class="play" aria-hidden="true">▶</span>' : '') + '</' + (vl ? 'a' : 'div') + '>';
    var ways = '<h3 class="sec">So baust du es nach</h3><div class="opts" id="ways">' + ['self', 'hf', 'avatar'].map(function (k) { return '<button class="opt" data-w="' + k + '" aria-pressed="' + (ME.way === k) + '"><span class="ic">' + WAYS[k][0] + '</span><span><b>' + esc(WAYS[k][1]) + '</b><small>' + esc(WAYS[k][2]) + '</small></span></button>'; }).join('') + '</div>' +
      '<div class="lv" id="lv"' + (ME.way === 'self' ? '' : ' hidden') + '>' + ['E1', 'E2', 'E3', 'E4'].map(function (k) { return '<button data-l="' + k + '" aria-pressed="' + (ME.level === k) + '">' + LVN[k] + '</button>'; }).join('') + '</div>' +
      '<p class="nt" id="wayhint"' + (ME.way === 'self' ? ' hidden' : '') + '>Noch nicht von uns getestet. Dein Agent fragt vor jedem Schritt, der Geld kostet.</p>';
    var P = $('#post'); P.dataset.id = c.id;
    P.innerHTML = '<div class="stage"><button class="x" id="sx" aria-label="Schließen">‹</button>' + vid + '</div>' +
      '<div class="panel"><div class="grab"></div><div class="scroll">' +
      '<div class="who"><span class="av">' + esc(c.id) + '</span><div class="nm"><b>' + esc(w.handle ? w.name + ' ' + w.handle : w.name) + '</b><small>' + esc(nums || 'Studio-Anleitung') + '</small></div>' + (vl ? '<a class="fol" href="' + esc(vl) + '" target="_blank" rel="noopener noreferrer">Original ↗</a>' : '') + '</div>' +
      '<p class="cap"><b>' + esc(hook) + '</b></p>' + (why ? '<p class="cap why">' + esc(why) + '</p>' : '') +
      (steps.length ? '<ul class="chk">' + steps.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + ways +
      '<div class="fld"><label for="mv">Deine Stimme</label><input id="mv" autocomplete="off" placeholder="z. B. locker, ruhig, frech" value="' + esc(ME.voice) + '"></div>' +
      '<p class="sm">Dein Agent erstellt, du postest selbst. Studio erzeugt und veröffentlicht nichts.</p>' +
      '<p class="sm" style="margin-top:6px">' + (nums ? 'Zahlen aus der Quelle, nicht neu geprüft. ' : '') + '<b>' + esc(c.status) + '</b> · Aufwand ' + esc(c.effort) + '</p>' +
      '<details class="more"><summary>Ganze Karte ansehen</summary>' + more + links + '<button class="cp2" data-i="all">Ganze Karte kopieren</button></details></div>' +
      '<div class="bar"><input id="mn" autocomplete="off" placeholder="Deine Nische, z. B. Insulinresistenz" value="' + esc(ME.niche) + '" aria-label="Deine Marke oder Nische"><button class="go" id="go">Für Agent kopieren</button></div></div>';
    P.classList.add('on'); D.body.style.overflow = 'hidden';
    if (!fromHash) { try { history.pushState(null, '', '#' + id); } catch (e) { location.hash = id; } }
    if (isV) want(c);
  }
  function closeCard(fromHash) {
    OPEN = null; $('#post').classList.remove('on'); D.body.style.overflow = '';
    if (!fromHash && location.hash) { try { history.back(); } catch (e) {} }
  }
  D.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.classList.contains('tile')) return openCard(t.dataset.id);
    if (t.id === 'sx') return closeCard();
    if (t.classList.contains('chip')) return setTab(t.dataset.t, t.dataset.e);
    if (t.dataset.w) { ME.way = t.dataset.w; saveMe(); D.querySelectorAll('#ways .opt').forEach(function (b) { b.setAttribute('aria-pressed', b === t ? 'true' : 'false'); }); var lv = $('#lv'), wh = $('#wayhint'); if (lv) lv.hidden = ME.way !== 'self'; if (wh) wh.hidden = ME.way === 'self'; return; }
    if (t.dataset.l) { ME.level = t.dataset.l; saveMe(); D.querySelectorAll('#lv button').forEach(function (b) { b.setAttribute('aria-pressed', b === t ? 'true' : 'false'); }); return; }
    var text = null, btn = t;
    if (t.id === 'go' && OPEN) text = buildPrompt(OPEN);
    else if (t.classList.contains('cp2') && OPEN) text = t.dataset.i === 'all' ? cardText(OPEN) : OPEN.fields[+t.dataset.i].text;
    if (text == null) return;
    copy(text).then(function (ok) { if (!ok) return fallback(text); var l = btn.textContent; btn.classList.add('ok'); btn.textContent = 'Kopiert ✓'; toast('Kopiert. Füg es bei deinem Agenten ein.'); setTimeout(function () { btn.classList.remove('ok'); btn.textContent = l; }, 1800); });
  });
  D.addEventListener('input', function (e) { if (e.target.id === 'mn') { ME.niche = e.target.value; saveMe(); } else if (e.target.id === 'mv') { ME.voice = e.target.value; saveMe(); } else if (e.target.id === 'q') { Q = e.target.value.trim().toLowerCase(); render(); } });
  $('#back').addEventListener('click', function (e) { try { if (D.referrer && new URL(D.referrer).origin === location.origin && history.length > 1) { e.preventDefault(); history.back(); } } catch (x) {} });
  function fromHash() { var id = decodeURIComponent((location.hash || '').slice(1)).toUpperCase(), c = id && DATA ? byId(id) : null; if (!c) { if (OPEN) closeCard(true); return; } if (!Q && c.area !== TAB) setTab(c.area, ''); openCard(c.id, true); }
  window.addEventListener('hashchange', fromHash);
  window.addEventListener('popstate', fromHash);
  D.addEventListener('keydown', function (e) { if (e.key === 'Escape' && OPEN) closeCard(); });
  fetch('cards.json', {cache: 'no-cache'}).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) { DATA = d; render(); fromHash(); })
    .catch(function () { $('#main').innerHTML = '<div class="empty">Die Karten konnten nicht geladen werden. Prüf deine Internetverbindung und lade die Seite neu.</div>'; });
})();
</script>
