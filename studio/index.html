<html lang="en">
<head>

<title>Studio · LOWiSPIKE</title>

<style>
/* LOWiSPIKE Studio (22 Nov 2026, Emmanuel: "they get the swipe file and they get the agent file ... I don't want people to have to
   learn anything"). Two sections only: Swipe file (videos that work: cover, views, transcript, strategy) and Agent file (prompts and
   skills to copy). Tap a video: Transcript, Translate, Copy for agent, the strategy, and Previous / Next. In the app's language.
   Owner (public.is_app_owner()): paste a TikTok link, paste the transcript, ✨ Fill writes hook, strategy and why (supabase/functions/
   studio-ai, the project's Gemini key). Built-in items come from cards.json; the owner's items and edits live in public.studio_config. */
:root{--ink:#eef3fb;--muted:#a9b6cb;--dim:#7f8ca3;--acc:#7cc4ff;--acc2:#bfe6ff;--line:rgba(159,216,255,.24);--line2:rgba(255,255,255,.09);--ok:#8fe6c8;--panel:#0c1322}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{overflow-x:hidden;background:#050912}
body{min-height:100vh;min-height:100dvh;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden;
  background:radial-gradient(120% 50% at 50% -8%,#112a5c 0%,#0a1736 38%,#060a15 72%,#050912 100%) fixed,#050912}
.wrap{width:min(720px,100%);margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 0}
.ib{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line2);text-decoration:none;font-size:22px;line-height:1;cursor:pointer;padding:0}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid var(--line2)}
.search svg{flex:none;width:20px;height:20px;color:var(--muted)}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:0}
.search input::placeholder{color:var(--dim)}
.tabs{display:flex;gap:6px;margin:14px 0 10px;padding:4px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line2)}
.tabs button{flex:1;min-height:42px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:#050912}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:14px;font-weight:650;cursor:pointer}
.pill.acc{border-color:var(--line);color:var(--acc2)}
.pill[aria-pressed=true]{background:var(--acc2);color:#050912}
.pill[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin:0 -16px}
.tile{position:relative;display:block;aspect-ratio:3/4;padding:0;border:0;background:#0c1426;color:#fff;font:inherit;text-align:left;cursor:pointer;overflow:hidden}
.cv{position:absolute;inset:0;background-size:cover;background-position:center}
.cv.nf{display:flex;align-items:center;justify-content:center;padding:14px 8px 34px}
.cv.nf q{font-size:12.5px;font-weight:700;line-height:1.28;text-align:center;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;quotes:none}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.6));pointer-events:none}
.tile .vw{position:absolute;left:8px;bottom:7px;z-index:2;display:flex;align-items:center;gap:5px;font-size:16px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.tile .vw svg{width:20px;height:20px}
/* 23 Nov 2026: playlists in the Swipe file (one swipeable row each; the name opens the full grid) */
.pl{margin:0 -16px 14px}
.pl-h{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0 16px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.pl-h b{font-size:18px}.pl-h span{color:var(--muted);font-weight:700}.pl-h:disabled{cursor:default;opacity:1}
.pl-row{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 4px) / 3);gap:2px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pl-row::-webkit-scrollbar{display:none}
.pl-row .tile{scroll-snap-align:start}
.pl-top{display:flex;align-items:center;gap:12px;margin:0 0 12px}.pl-top b{flex:1;font-size:20px}.pl-top span{color:var(--muted);font-weight:700}
.pl-edit{display:block;margin:0 0 12px;border:1px solid var(--line2);border-radius:16px;background:rgba(255,255,255,.04)}
.pl-edit summary{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 16px;cursor:pointer;list-style:none;font-size:16px}.pl-edit summary::-webkit-details-marker{display:none}
.pl-edit summary::after{content:'›';margin-left:8px;color:var(--muted);transition:transform .2s}.pl-edit[open] summary::after{transform:rotate(90deg)}.pl-edit summary span{margin-left:auto;color:var(--muted)}
.pl-list{display:flex;flex-direction:column;padding:0 8px 8px}.pl-li{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:0 10px;border:0;border-top:1px solid var(--line2);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.pl-li span{color:var(--muted);flex:none}.pl-li.add{color:var(--acc2);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:15;width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(180deg,#bfe6ff,#7cc4ff);color:#05070c;font-size:34px;line-height:1;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:pointer}
.f-pls{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}.f-pls .pl-chip[aria-pressed=true]{background:var(--acc2);color:#05070c;border-color:var(--acc2)}
.pl-chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.07);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.pl-chip.add{border-style:dashed;color:var(--acc2)}
.pl-pick{margin:6px -18px 0}.pl-pick .tile.picked::before{content:"";position:absolute;inset:0;z-index:2;box-shadow:inset 0 0 0 3px var(--acc2);background:rgba(124,196,255,.18)}
.tile.ag .cv.nf q{font-size:15px;-webkit-line-clamp:7}
.tile.ag .vw{font-size:13px;opacity:.9}
.xb{position:absolute;top:6px;right:6px;z-index:3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.55);border:2px solid #fff;color:#fff;font-size:17px;font-weight:800}
.xb::after{content:"";position:absolute;inset:-8px}
.xb.on{background:#ff3b30;border-color:#ff3b30}
.prompt{position:relative}.prompt .xb{top:10px;right:10px}
.tile.sel::before,.prompt.sel::before{content:"";position:absolute;inset:0;z-index:2;background:rgba(255,59,48,.35);box-shadow:inset 0 0 0 3px #ff3b30;border-radius:inherit}
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(10,16,32,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.12)}
#selbar[hidden]{display:none}
#selbar button{flex:1;min-height:48px;border-radius:14px;border:0;background:rgba(255,255,255,.12);color:#fff;font:600 16px system-ui}
#selbar .plb{background:#2f7cf6}#selbar .plb:disabled{opacity:.4}
.ed-sec{margin:0 0 14px}.ed-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;width:100%;min-height:46px;padding:6px 16px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ed-h b{font-size:18px}.ed-h span{color:var(--muted)}.ed-h small{width:100%;color:var(--muted);font-size:13px}.ed-new b{color:var(--acc2)}
#selbar .delb{background:#ff3b30}#selbar .delb:disabled{opacity:.4}
.tile.hid{opacity:.35}
.tile.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(124,196,255,.08);border:1.5px dashed var(--line);color:var(--acc2);font-weight:700;font-size:14px}
.tile.add span{font-size:30px;line-height:1}
.list{display:grid;gap:10px}
.prompt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:18px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;cursor:pointer}
.prompt b{display:block;font-size:16px;line-height:1.3}
.prompt small{display:-webkit-box;margin-top:4px;color:var(--muted);font-size:14px;line-height:1.35;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prompt.hid{opacity:.4}
.prompt.add{border-style:dashed;border-color:var(--line);color:var(--acc2);font-weight:700;text-align:center}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}
/* the open item */
.view{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;background:#000}
.view.on{display:flex}
.vtop{flex:none;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
.vtop .cnt{flex:1;text-align:center;color:var(--muted);font-size:14px;font-weight:600}
.vbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 18px 16px}
.vid{position:relative;display:block;width:min(44vw,210px,calc((100dvh - 430px) * .6));aspect-ratio:9/15;margin:0 auto 14px;border-radius:18px;overflow:hidden;background:#0c1426;color:#fff;text-decoration:none}
.vid .play{position:absolute;top:50%;left:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:19px;padding-left:4px}
.who b{display:block;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.who small{color:var(--muted);font-size:14px}
.who .bio{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.acts .btn{justify-content:center}
.acts .btn.pri{grid-column:1/-1;order:-1;min-height:52px;font-size:16px}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:46px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.26);color:#fff;font:inherit;font-size:15px;font-weight:650;cursor:pointer;
  background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#050912;border:0;box-shadow:none}
.btn.ok{background:linear-gradient(180deg,#c9f5e6,var(--ok));color:#050912;border:0}
.btn[aria-pressed=true]{background:rgba(124,196,255,.22);border-color:rgba(159,216,255,.6)}
.btn:disabled{opacity:.5}
.box{margin:0 0 14px;padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line2);white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.box[hidden]{display:none}
h3{margin:16px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc2)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc2);color:#050912;font-size:13px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.why{margin:10px 0 0;color:var(--muted);font-size:15px}
.owner{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.vnav{flex:none;display:flex;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);background:var(--panel)}
.vnav .btn{flex:1;justify-content:center}
/* owner sheet */
.dlg{position:fixed;inset:0;z-index:45;display:none;align-items:flex-end;background:rgba(0,0,0,.6)}
.dlg.on{display:flex}
.dlg .in{width:min(680px,100%);margin:0 auto;max-height:92dvh;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));background:#0a1224;border-top:1px solid var(--line);border-radius:22px 22px 0 0}
.dlg h2{margin:0 0 6px;font-size:20px}
.dlg label{display:block;margin:12px 0 4px;color:var(--muted);font-size:13px}
.dlg input,.dlg textarea{width:100%;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px}
.dlg input{height:46px}
.dlg textarea{min-height:110px}
.dlg .note{margin:6px 0 0;color:var(--dim);font-size:13px}
.dlg .btns{display:flex;gap:10px;margin-top:16px}
.dlg .btns .btn{flex:1;justify-content:center}
/* 23 Nov 2026 (Emmanuel: "when I add a new video ... I can still see the select all and delete ... I can't scroll down enough to click on
   save ... you did the wardrobe thing again"): every form is a full page that scrolls, its Cancel / Save row stays pinned at the
   bottom, and the Edit bar (Select all / Delete) is hidden while a form is open */
.dlg{align-items:stretch;background:#0a1224;z-index:60}
.dlg .in{width:min(680px,100%);height:100%;max-height:none;border:0;border-radius:0;padding:calc(14px + env(safe-area-inset-top)) 18px 0;overscroll-behavior:contain}
.dlg .in>.btns:last-child,.dlg .in>.btns.pin{position:sticky;bottom:0;z-index:2;margin:16px -18px 0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(10,18,36,.85),#0a1224 30%);border-top:1px solid var(--line2)}
.dlg.on ~ #selbar,body:has(.dlg.on) #selbar{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);padding:12px 16px;border-radius:14px;background:rgba(14,22,40,.97);border:1px solid var(--line);font-size:15px;display:none}
.toast.on{display:block}
.fb{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;background:rgba(0,0,0,.6)}
.fb.on{display:flex}
.fb .in{width:100%;max-height:80dvh;display:flex;flex-direction:column;gap:10px;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:#0a1224;border-top:1px solid var(--line);border-radius:20px 20px 0 0}
.fb textarea{flex:1;min-height:200px;width:100%;border-radius:12px;border:1px solid var(--line2);background:#050912;color:var(--ink);font:inherit;font-size:16px;padding:10px}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
/* 24 Nov 2026: Video machine (video-machine.js) */

.ap-seg{display:flex;gap:4px;width:100%;margin:14px auto 4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line2);max-width:340px}.ap-seg button{flex:1;min-height:40px;border:0;border-radius:11px;background:none;color:inherit;font:inherit;font-weight:800;white-space:nowrap;cursor:pointer;opacity:.7}.ap-seg button[aria-selected="true"]{background:rgba(255,255,255,.16);opacity:1}
.vm-prof{padding:0 0 30px}.vm-h{margin:16px 14px 6px;font-size:15px}.vm-prof .note{margin:6px 14px}

  transform:scale(calc(.82 + var(--k) * .18)) rotateY(calc((1 - var(--k)) * 8deg));opacity:calc(.55 + var(--k) * .45);transition:transform .12s,opacity .12s,box-shadow .2s}

  function loadDoc() { return fetch(SBURL + '/rest/v1/studio_config?id=eq.main&select=data', {headers: {apikey: PUBKEY, Authorization: 'Bearer ' + PUBKEY}, cache: 'no-store'}).then(function (r) { return r.ok ? r.json() : []; }).then(function (rows) { DOC = rows && rows[0] && rows[0].data || {}; if (DOC.v !== 2) DOC = {v: 2, swipe: [], agent: [], items: {}}; }).catch(function () { DOC = {v: 2, swipe: [], agent: [], items: {}}; }); }
  function loadScript(src) { return new Promise(function (ok, no) { var s = D.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; D.head.appendChild(s); }); }
  function checkOwner() {
    var has = false; try { has = !!localStorage.getItem('lowi.auth'); } catch (e) {} if (!has) return;

      .then(function (r) { OWNER = !!(r && r.data === true); $('#editb').hidden = !OWNER; var ab = $('#aib'); if (ab && window.StudioAiUse) { ab.hidden = !OWNER; ab.textContent = StudioAiUse.label(); ab.onclick = StudioAiUse.open; }   /* 23 Nov 2026: ai-use.js */ if (OWNER) render();   /* 23 Nov 2026: shows the owner's + button */ }).catch(function () {});

  function delOne(id) { var x = (SW.concat(AG)).filter(function (q) { return q.id === id; })[0]; if (!x) return;

  function save() { if (!SB || !OWNER) return Promise.reject(new Error('owner')); DOC.v = 2; return SB.rpc('studio_save', {doc: DOC}).then(function (r) { if (r && r.error) throw r.error; toast(t('saved')); }).catch(function (e) { toast(t('notSaved')); throw e; }); }
  function dlg(html) { var d = $('#dlg'); d.innerHTML = '<div class="in">' + html + '</div>'; d.classList.add('on'); }

  /* 23 Nov 2026 (Emmanuel: "make it easier for me to put the new videos that I fill with AI into the right folder"): the video dialog

  var FPL = {};

  function agentDlg(x) { x = x || {}; dlg('<h2>' + esc(x.id ? t('edit') : t('addPrompt')) + '</h2><label for="f_ti">' + esc(t('title')) + '</label><input id="f_ti" value="' + esc(x.title || '') + '"><label for="f_tx">' + esc(t('text')) + '</label><textarea id="f_tx" style="min-height:220px">' + esc(x.text || '') + '</textarea><div class="btns"><button class="btn" data-d="cancel">' + esc(t('cancel')) + '</button><button class="btn pri" data-d="saveA" data-id="' + esc(x.id || '') + '">' + esc(t('save')) + '</button></div>'); }

  }
  function linkOk(u) { return /^https:\/\/([a-z0-9-]+\.)*(tiktok\.com|instagram\.com)\//i.test(u); }
  function onDlg(b) {
    var k = b.dataset.d, v = function (id) { var e = $('#' + id); return e ? e.value.trim() : ''; };
    if (k === 'cancel') return dlgClose();
    if (k === 'fill') {
      if (!linkOk(v('f_link'))) return toast(t('badLink')); var lab = b.textContent; b.disabled = true; b.textContent = t('filling');
      ai({action: 'fill', link: v('f_link'), transcript: v('f_tr'), lang: L}).then(function (j) {

        set('f_tr', j.transcript); set('f_cr', [j.meta.author, j.meta.handle].filter(Boolean).join(' ')); set('f_hk', j.hook, true); set('f_st', (j.strategy || []).join('\n'), true); set('f_why', j.why, true); set('f_th', j.meta.thumb, true);
      }).catch(function (e) { toast(/owner/.test(e.message) ? t('ownerOnly') : t('fillFail')); }).then(function () { b.disabled = false; b.textContent = lab; });
      return;
    }
    if (k === 'saveS') {
      if (!linkOk(v('f_link'))) return toast(t('badLink'));
      var o = {link: v('f_link'), creator: v('f_cr'), views: parseViews(v('f_vw')), transcript: v('f_tr'), hook: v('f_hk'), strategy: v('f_st').split('\n').map(function (s) { return s.trim(); }).filter(Boolean), why: v('f_why'), thumb: v('f_th')};
      var id = b.dataset.id, isB = id && !(DOC.swipe || []).some(function (s) { return s.id === id; });
      /* 23 Nov 2026 (Emmanuel: "make sure you're able to check ... if I'm not sending you the same profile again"): a new item whose
         link or @handle is already in the Swipe file asks first, naming what is there */
      if (!id) { var same = dupOf(o); if (same.length && !confirm(t('dupQ').replace('{x}', same.slice(0, 3).map(function (q) { return q.creator; }).join(', ')))) return; }
      if (lists().length) plApply(id || (o.id = 'V' + Date.now().toString(36).toUpperCase()));
      if (isB) { var ov = over(id); for (var f in o) ov[f] = o[f]; } else if (id) { DOC.swipe = DOC.swipe.map(function (s) { if (s.id !== id) return s; for (var f2 in o) s[f2] = o[f2]; return s; }); } else { o.id = o.id || 'V' + Date.now().toString(36).toUpperCase(); o.ts = Date.now(); DOC.swipe = (DOC.swipe || []).concat([o]); }
      return save().then(function () { dlgClose(); rebuild(); render(); if (OPEN) open(id || o.id, true); }, function () {});
    }
    if (k === 'pladd') { var add = Object.keys(SEL), tid = b.dataset.id; DOC.lists = lists().map(function (q) { if (q.id !== tid) return q; var it = (q.items || []).slice(); add.forEach(function (i) { if (it.indexOf(i) < 0) it.push(i); }); return {id: q.id, name: q.name, items: it}; });
      return save().then(function () { SEL = {}; dlgClose(); render(); }, function () {}); }
    if (k === 'fpl') { var fid = b.dataset.id; if (FPL[fid]) delete FPL[fid]; else FPL[fid] = 1; b.setAttribute('aria-pressed', !!FPL[fid]); return; }
    if (k === 'pltog') { var pid = b.dataset.id; if (PLSEL[pid]) delete PLSEL[pid]; else PLSEL[pid] = 1; var on = !!PLSEL[pid]; b.classList.toggle('picked', on); b.setAttribute('aria-pressed', on); var xb = b.querySelector('.xb'); xb.classList.toggle('ok', on); xb.textContent = on ? '✓' : ''; return; }
    if (k === 'plsave') { var nm = v('f_pl'); if (!nm) return toast(t('plName')); var ids = Object.keys(PLSEL), L0 = lists().slice(), qid = b.dataset.id;
      if (qid) L0 = L0.map(function (z) { return z.id === qid ? {id: z.id, name: nm, items: ids} : z; }); else L0.push({id: 'L' + Date.now().toString(36), name: nm, items: ids});
      DOC.lists = L0; return save().then(function () { dlgClose(); render(); }, function () {}); }
    if (k === 'pldel') { if (!confirm(t('plDelQ'))) return; DOC.lists = lists().filter(function (z) { return z.id !== b.dataset.id; }); return save().then(function () { dlgClose(); render(); }, function () {}); }
    if (k === 'saveA') {
      var a = {title: v('f_ti'), text: v('f_tx')}; if (!a.title || !a.text) return; var aid = b.dataset.id, isBA = aid && !(DOC.agent || []).some(function (s) { return s.id === aid; });
      if (isBA) { var oa = over(aid); oa.title = a.title; oa.text = a.text; } else if (aid) { DOC.agent = DOC.agent.map(function (s) { return s.id === aid ? (s.title = a.title, s.text = a.text, s) : s; }); } else { a.id = 'P' + Date.now().toString(36).toUpperCase(); a.ts = Date.now(); DOC.agent = (DOC.agent || []).concat([a]); }
      return save().then(function () { dlgClose(); rebuild(); render(); if (OPEN) open(aid || a.id, true); }, function () {});
    }
  }
  function share(url) {
    if (navigator.share) return navigator.share({title: 'LOWiSPIKE Studio', text: t('shareT'), url: url}).catch(function () {});
    copy(url).then(function (ok) { if (ok) toast(t('linkCopied')); else fallback(url); });

  D.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.d) return onDlg(b);
    if (b.dataset.tab) { TAB = b.dataset.tab; PL = ''; render(); return window.scrollTo(0, 0); }
    if (b.id === 'sortb') { SORT = SORT === 'views' ? 'new' : 'views'; return render(); }
    if (b.id === 'editb') { EDIT = !EDIT; SEL = {}; PL = ''; return render(); }
    if (b.dataset.pl) { PL = b.dataset.pl; render(); return window.scrollTo(0, 0); }
    if (b.hasAttribute('data-pl-back')) { PL = ''; return render(); }
    if (b.hasAttribute('data-pl-edit')) { PLOPEN = true; return plDlg(b.dataset.plEdit); }
    /* 22 Nov 2026 (Emmanuel: "when I click on edit, an X toggle where I can easily just mass delete things"): in Edit every tile has an X;
       tapping it marks the tile, the bar at the bottom deletes all marked at once. Tapping the rest of the tile still opens it. */
    if (EDIT && e.target.closest('[data-x]') && b.dataset.id) { var k = b.dataset.id; if (SEL[k]) delete SEL[k]; else SEL[k] = 1; return render(); }
    if (b.dataset.sel === 'all') { var all = cur(), on = all.every(function (x) { return SEL[x.id]; }); SEL = {}; if (!on) all.forEach(function (x) { SEL[x.id] = 1; }); return render(); }
    if (b.dataset.sel === 'pl') { var n0 = Object.keys(SEL).length; if (!n0) return;
      return dlg('<h2>' + esc(t('plAddH').replace('{n}', n0)) + '</h2><div class="pl-list">' + lists().map(function (q) { return '<button class="pl-li" data-d="pladd" data-id="' + esc(q.id) + '"><b>' + esc(q.name) + '</b><span>' + (q.items || []).length + '</span></button>'; }).join('') + '</div><div class="btns"><button class="btn" data-d="cancel">' + esc(t('cancel')) + '</button></div>'); }
    if (b.dataset.sel === 'del') { var ids = Object.keys(SEL); if (!ids.length || !confirm(t('confirmDelN').replace('{n}', ids.length))) return;
      ids.forEach(delOne); return save().then(function () { SEL = {}; rebuild(); render(); }, function () {}); }
    if (b.id === 'share') return share(location.origin + location.pathname);

    var a = b.dataset.a, x = OPEN; if (!a) return;

    if (a === 'prev') return step(-1);

    if (a === 'tr') { var bx = $('#trbox'); bx.hidden = !bx.hidden; b.setAttribute('aria-pressed', bx.hidden ? 'false' : 'true'); return; }

      var list0 = cur(), at = -1; for (var q = 0; q < list0.length; q++) if (list0[q].id === x.id) at = q;
      delOne(x.id);
      return save().then(function () { rebuild(); render(); var l2 = cur(), nx = l2[Math.min(at, l2.length - 1)]; if (nx) open(nx.id, true); else close(); }, function () {}); }
  });
  /* swipe left / right in an open item = Next / Previous */
  var sx = 0, sy = 0; $('#view').addEventListener('touchstart', function (e) { var p = e.touches[0]; sx = p.clientX; sy = p.clientY; }, {passive: true});
  $('#view').addEventListener('touchend', function (e) { var p = e.changedTouches[0], dx = p.clientX - sx, dy = p.clientY - sy; if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1); }, {passive: true});
  $('#dlg').addEventListener('click', function (e) { if (e.target.id === 'dlg') dlgClose(); });

  Promise.all([fetch('cards.json', {cache: 'no-cache'}).then(function (r) { return r.json(); }), loadDoc()]).then(function (x) { DATA = x[0]; rebuild(); render(); fromHash(); checkOwner(); })
