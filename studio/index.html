html,body{margin:0}
html{overflow-x:hidden;background:#050912}
body{min-height:100vh;min-height:100dvh;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden;
  background:radial-gradient(120% 50% at 50% -8%,#112a5c 0%,#0a1736 38%,#060a15 72%,#050912 100%) fixed,#050912}
.wrap{width:min(720px,100%);margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 0}
.ib{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line2);text-decoration:none;font-size:22px;line-height:1;cursor:pointer;padding:0}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid var(--line2)}
.search svg{flex:none;width:20px;height:20px;color:var(--muted)}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:0}
.search input::placeholder{color:var(--dim)}
.tabs{display:flex;gap:6px;margin:14px 0 10px;padding:4px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line2)}
.tabs button{flex:1;min-height:42px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:#050912}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:14px;font-weight:650;cursor:pointer}
.pill.acc{border-color:var(--line);color:var(--acc2)}
.pill[aria-pressed=true]{background:var(--acc2);color:#050912}
.pill[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin:0 -16px}
.tile{position:relative;display:block;aspect-ratio:3/4;padding:0;border:0;background:#0c1426;color:#fff;font:inherit;text-align:left;cursor:pointer;overflow:hidden}
.cv{position:absolute;inset:0;background-size:cover;background-position:center}
.cv.nf{display:flex;align-items:center;justify-content:center;padding:14px 8px 34px}
.cv.nf q{font-size:12.5px;font-weight:700;line-height:1.28;text-align:center;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;quotes:none}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.6));pointer-events:none}
.tile .vw{position:absolute;left:8px;bottom:7px;z-index:2;display:flex;align-items:center;gap:5px;font-size:16px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.tile .vw svg{width:20px;height:20px}
.tile.hid{opacity:.35}
.tile.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(124,196,255,.08);border:1.5px dashed var(--line);color:var(--acc2);font-weight:700;font-size:14px}
.tile.add span{font-size:30px;line-height:1}
.list{display:grid;gap:10px}
.prompt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:18px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;cursor:pointer}
.prompt b{display:block;font-size:16px;line-height:1.3}
.prompt small{display:-webkit-box;margin-top:4px;color:var(--muted);font-size:14px;line-height:1.35;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prompt.hid{opacity:.4}
.prompt.add{border-style:dashed;border-color:var(--line);color:var(--acc2);font-weight:700;text-align:center}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}

.view{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;background:#000}
.view.on{display:flex}
.vtop{flex:none;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
.vtop .cnt{flex:1;text-align:center;color:var(--muted);font-size:14px;font-weight:600}
.vbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 18px 16px}

.who b{display:block;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.who small{color:var(--muted);font-size:14px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}

.acts .btn.pri{grid-column:1/-1;order:-1;min-height:52px;font-size:16px}

.btn:disabled{opacity:.5}
.box{margin:0 0 14px;padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line2);white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.box[hidden]{display:none}
h3{margin:16px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc2)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc2);color:#050912;font-size:13px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.why{margin:10px 0 0;color:var(--muted);font-size:15px}
.owner{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.vnav{flex:none;display:flex;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);background:var(--panel)}
.vnav .btn{flex:1;justify-content:center}
/* owner sheet */
.dlg{position:fixed;inset:0;z-index:45;display:none;align-items:flex-end;background:rgba(0,0,0,.6)}
.dlg.on{display:flex}
.dlg .in{width:min(680px,100%);margin:0 auto;max-height:92dvh;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));background:#0a1224;border-top:1px solid var(--line);border-radius:22px 22px 0 0}
.dlg h2{margin:0 0 6px;font-size:20px}
.dlg label{display:block;margin:12px 0 4px;color:var(--muted);font-size:13px}
.dlg input,.dlg textarea{width:100%;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px}
.dlg input{height:46px}
.dlg textarea{min-height:110px}
.dlg .note{margin:6px 0 0;color:var(--dim);font-size:13px}
.dlg .btns{display:flex;gap:10px;margin-top:16px}
.dlg .btns .btn{flex:1;justify-content:center}

.toast.on{display:block}
.fb{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;background:rgba(0,0,0,.6)}
.fb.on{display:flex}
.fb .in{width:100%;max-height:80dvh;display:flex;flex-direction:column;gap:10px;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:#0a1224;border-top:1px solid var(--line);border-radius:20px 20px 0 0}
.fb textarea{flex:1;min-height:200px;width:100%;border-radius:12px;border:1px solid var(--line2);background:#050912;color:var(--ink);font:inherit;font-size:16px;padding:10px}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
@media (min-width:700px){.grid{margin:0}.tile{border-radius:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
