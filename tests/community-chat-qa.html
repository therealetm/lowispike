<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Community chat · isolated QA fixture · NOT LIVE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070f17;color:#e6edf4;font:14px/1.5 system-ui}button,select{font:inherit}#qa-bar{padding:12px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;border-bottom:1px solid #455661}#qa-bar strong{flex:1;min-width:220px}#qa-bar button,#qa-bar select{padding:9px;border:1px solid #526775;border-radius:10px;background:#152630;color:inherit}#qa-frame{display:block;border:1px solid #526775;margin:16px auto;background:#10202a;max-width:none}#qa-wrap{overflow:auto;height:calc(100dvh - 80px)}
</style><div id="qa-bar"><strong>ISOLATED FIXTURE · simulated accounts and backend · NOT LIVE</strong><select id="qa-size" aria-label="Viewport"><option value="375,667">Small phone · 375 × 667</option><option selected value="390,844">Phone · 390 × 844</option><option value="768,1024">iPad portrait · 768 × 1024</option><option value="1024,768">iPad landscape · 1024 × 768</option></select><button data-mode="normal">Connected</button><button data-mode="fail">Fail sends</button><button data-mode="empty">Empty room</button><button data-mode="load-fail">Fail loading</button><button data-mode="arrive">New message</button><button data-mode="reset">Reset fixture</button></div><div id="qa-wrap"><iframe id="qa-frame" title="Simulated Community chat" src="community-chat-stage.html"></iframe></div><script>
const frame=document.getElementById('qa-frame'),size=document.getElementById('qa-size');function resize(){const [w,h]=size.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px';}size.onchange=resize;resize();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>frame.contentWindow.postMessage({communityQA:b.dataset.mode},location.origin==='null'?'*':location.origin));
</script></html>
